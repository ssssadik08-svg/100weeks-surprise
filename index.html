<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayesha + Sadik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030814;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Luxury Pull Screen */
        #pull-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #081d33, #020710);
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: none;
            transition: opacity 1s ease;
        }

        .cord-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cord-line {
            width: 4px;
            height: 280px;
            background: linear-gradient(to bottom, #ffd700, #00f2fe, #fff);
            box-shadow: 0 0 15px #00f2fe, 0 0 25px #ffd700;
            transition: height 0.1s ease;
        }

        .cord-handle {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #ffffff, #00c6ff);
            border-radius: 50%;
            box-shadow: 0 0 25px #00f2fe, 0 0 35px #ffffff;
            border: 2px solid #ffd700;
        }

        .pull-hint {
            color: #ffd700;
            margin-top: 45px;
            font-family: 'Cinzel', serif;
            font-size: 19px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: pulseGlow 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.04); }
        }

        /* Welcome Screen with Classy Font */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 1.8s ease-in-out;
            text-align: center;
        }

        .welcome-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .welcome-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-title {
            font-family: 'Great Vibes', cursive;
            color: #ffffff;
            font-size: 54px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #00f2fe, 0 0 40px #0088ff, 0 0 60px #ffffff;
            line-height: 1.4;
        }

        .welcome-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #ffd700;
            margin-top: 20px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #matrixCanvas { z-index: 10; }
        #fireworksCanvas { z-index: 20; pointer-events: none; }
        #textCanvas { z-index: 30; pointer-events: none; }

        /* Floating Circular Tap Button */
        .right-tap-btn {
            position: fixed;
            right: 25px;
            bottom: 40%;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #00f2fe, #0052d4);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.9);
            cursor: pointer;
            z-index: 100;
            display: none;
            animation: floatBtn 2s infinite alternate ease-in-out;
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        /* Glass Mirror Box Card */
        .card-container {
            position: relative;
            z-index: 200;
            background: rgba(3, 14, 26, 0.94);
            border: 2px solid #00f2fe;
            outline: 2px solid #ffd700;
            outline-offset: -7px;
            border-radius: 16px;
            padding: 40px 30px;
            width: 88%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.35), inset 0 0 30px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(15px);
            display: none;
            animation: popup 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .corner-ornament {
            position: absolute;
            width: 32px;
            height: 32px;
            fill: #ffd700;
        }
        .top-left { top: 6px; left: 6px; }
        .top-right { top: 6px; right: 6px; transform: scaleX(-1); }
        .bottom-left { bottom: 6px; left: 6px; transform: scaleY(-1); }
        .bottom-right { bottom: 6px; right: 6px; transform: scale(-1); }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #00f2fe;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.7);
        }

        .card-desc {
            font-size: 16px;
            color: #e0f7fa;
            line-height: 1.8;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .swipe-hint {
            font-size: 12px;
            color: #ffd700;
            margin-top: 15px;
            letter-spacing: 1.5px;
            font-family: 'Cinzel', serif;
        }

        .btn-custom {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: 1px solid #ffffff;
            padding: 12px 30px;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Pull Cord Screen -->
    <div id="pull-screen">
        <div class="cord-wrapper" id="cordWrapper">
            <div class="cord-line" id="cordLine"></div>
            <div class="cord-handle"></div>
        </div>
        <div class="pull-hint">PULL DOWN TO BEGIN ✨</div>
    </div>

    <!-- Welcome Entry Screen -->
    <div id="welcome-screen">
        <div class="welcome-content" id="welRow1">
            <div class="welcome-title">Hey Ayesha, My Love</div>
        </div>
        <div class="welcome-content" id="welRow2">
            <div class="welcome-subtitle">WELCOME. THIS IS FOR YOU ✨</div>
        </div>
    </div>

    <!-- Canvases -->
    <canvas id="matrixCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>
    <canvas id="textCanvas"></canvas>

    <!-- Floating Circular Tap Button -->
    <div id="rightTapBtn" class="right-tap-btn" onclick="nextSequenceStep()">TAP</div>

    <!-- Decorated Mirror Glass Card -->
    <div id="mainCard" class="card-container">
        <svg class="corner-ornament top-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament top-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>

        <h2 id="cardTitle" class="card-title"></h2>
        <p id="cardDesc" class="card-desc"></p>

        <div id="btnContainer">
            <button id="nextBtn" class="btn-custom" onclick="nextSlide()">NEXT ✨</button>
        </div>
        <div class="swipe-hint">👈 SWIPE LEFT OR TAP TO FLIP</div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const textCanvas = document.getElementById('textCanvas');
        const tCtx = textCanvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');

        const pullScreen = document.getElementById('pull-screen');
        const cordWrapper = document.getElementById('cordWrapper');
        const cordLine = document.getElementById('cordLine');
        const welcomeScreen = document.getElementById('welcome-screen');
        const welRow1 = document.getElementById('welRow1');
        const welRow2 = document.getElementById('welRow2');
        const bgMusic = document.getElementById('bgMusic');
        const rightTapBtn = document.getElementById('rightTapBtn');

        function resize() {
            matrixCanvas.width = textCanvas.width = fwCanvas.width = window.innerWidth;
            matrixCanvas.height = textCanvas.height = fwCanvas.height = window.innerHeight;
            initMatrixColumns();
        }

        // True Vertical Rain Matrix Effect
        const matrixWords = ['100 WEEKS', '700 DAYS', 'AYESHA + SADIK', 'AHUBATI + AHUBI', 'LOVE YOU'];
        let columns = 0;
        let drops = [];
        let colWords = [];

        function initMatrixColumns() {
            columns = Math.floor(window.innerWidth / 45);
            drops = [];
            colWords = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -30);
                colWords[i] = matrixWords[Math.floor(Math.random() * matrixWords.length)];
            }
        }
        resize();
        window.addEventListener('resize', resize);

        let matrixInterval;
        function startMatrixRain() {
            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(drawMatrixBG, 55);
        }

        function drawMatrixBG() {
            mCtx.fillStyle = 'rgba(3, 8, 20, 0.2)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            mCtx.font = 'bold 15px monospace';

            for (let i = 0; i < drops.length; i++) {
                const word = colWords[i];
                const x = i * 45 + 5;
                const y = drops[i] * 22;

                for (let j = 0; j < word.length; j++) {
                    const char = word[j];
                    const charY = y - (j * 18);
                    if (charY > 0 && charY < matrixCanvas.height) {
                        // Soft Glow Colors for Falling Rain
                        mCtx.fillStyle = (j === 0) ? '#ffffff' : 'rgba(0, 242, 254, 0.35)';
                        mCtx.shadowColor = '#00f2fe';
                        mCtx.shadowBlur = (j === 0) ? 8 : 0;
                        mCtx.fillText(char, x, charY);
                    }
                }

                if (y - (word.length * 18) > matrixCanvas.height && Math.random() > 0.94) {
                    drops[i] = 0;
                    colWords[i] = matrixWords[Math.floor(Math.random() * matrixWords.length)];
                }
                drops[i]++;
            }
        }

        // Cord Mechanics
        let startY = 0, currentDrag = 0;
        const maxDrag = 170;

        cordWrapper.addEventListener('touchstart', (e) => startY = e.touches[0].clientY);
        cordWrapper.addEventListener('touchmove', (e) => {
            let y = e.touches[0].clientY;
            currentDrag = Math.max(0, Math.min(maxDrag, y - startY));
            cordLine.style.height = (280 + currentDrag) + 'px';
            if (currentDrag >= maxDrag) triggerSystemStart();
        });
        cordWrapper.addEventListener('touchend', () => { if (currentDrag < maxDrag) cordLine.style.height = '280px'; });
        cordWrapper.addEventListener('click', () => triggerSystemStart());

        function triggerSystemStart() {
            bgMusic.play().catch(()=>{});
            pullScreen.style.opacity = '0';

            // Rain Matrix Starts BEFORE Welcome
            startMatrixRain();

            setTimeout(() => {
                pullScreen.style.display = 'none';
                welcomeScreen.style.display = 'flex';
                startFireworks();

                setTimeout(() => { welRow1.classList.add('show'); createFirework(window.innerWidth/2, window.innerHeight*0.38); }, 400);
                setTimeout(() => { welRow2.classList.add('show'); createFirework(window.innerWidth/2, window.innerHeight*0.58); }, 2200);

                setTimeout(() => {
                    welcomeScreen.style.opacity = '0';
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        stopFireworks();
                        startCountdownSequence();
                    }, 1800);
                }, 5800);
            }, 800);
        }

        // Slow & Colorful Fireworks Engine
        let fwInterval, particles = [];
        function startFireworks() {
            fwInterval = setInterval(() => { createFirework(Math.random() * fwCanvas.width, Math.random() * fwCanvas.height * 0.5); }, 800);
            animateFireworks();
        }
        function createFirework(x, y) {
            const count = 30;
            // Mixed Colors: Gold, Pink, Purple
            const colors = ['#ffd700', '#ff007f', '#a855f7', '#00f2fe', '#ffffff'];
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const speed = Math.random() * 2.5 + 1.2; // Slower velocity
                particles.push({ 
                    x: x, y: y, 
                    vx: Math.cos(angle) * speed, 
                    vy: Math.sin(angle) * speed, 
                    alpha: 1, 
                    color: chosenColor 
                });
            }
        }
        function animateFireworks() {
            fwCtx.fillStyle = 'rgba(3, 8, 20, 0.15)';
            fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.012; // Slow fade
                fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color; fwCtx.globalAlpha = p.alpha; fwCtx.fill();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
            fwCtx.globalAlpha = 1;
            requestAnimationFrame(animateFireworks);
        }
        function stopFireworks() { clearInterval(fwInterval); fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }

        // Solid Pixel Text Canvas
        function renderTextPixel(text) {
            tCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            if (!text) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = textCanvas.width;
            tempCanvas.height = textCanvas.height;

            let dynamicFontSize = Math.min(textCanvas.width / (text.length * 0.65), textCanvas.height * 0.22);
            if (dynamicFontSize > 80) dynamicFontSize = 80;

            tempCtx.fillStyle = '#fff';
            tempCtx.font = `bold ${dynamicFontSize}px sans-serif`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(text, tempCanvas.width / 2, tempCanvas.height / 2);

            const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imgData.data;

            const pixelSize = 5;
            tCtx.fillStyle = '#00f2fe';
            tCtx.shadowColor = '#ffffff';
            tCtx.shadowBlur = 12;

            for (let y = 0; y < tempCanvas.height; y += pixelSize) {
                for (let x = 0; x < tempCanvas.width; x += pixelSize) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (data[index + 3] > 100) {
                        tCtx.fillRect(x, y, pixelSize, pixelSize);
                    }
                }
            }
        }

        // Fixed Countdown & Main Sequence Logic
        const mainSequence = [
            "100 WEEKS",
            "700 DAYS",
            "AYESHA + SADIK",
            "AHUBATI + AHUBI",
            "I LOVE YOU"
        ];

        let seqIndex = 0;

        function startCountdownSequence() {
            rightTapBtn.style.display = 'none'; // Lock TAP during 3-2-1
            
            renderTextPixel("3");
            setTimeout(() => {
                renderTextPixel("2");
                setTimeout(() => {
                    renderTextPixel("1");
                    setTimeout(() => {
                        seqIndex = 0;
                        rightTapBtn.style.display = 'flex'; // Unlock TAP for Main Sequence
                        playNextMainSequence();
                    }, 800);
                }, 800);
            }, 800);
        }

        function playNextMainSequence() {
            if (seqIndex < mainSequence.length) {
                renderTextPixel(mainSequence[seqIndex]);
                createFirework(window.innerWidth / 2, window.innerHeight / 2);
            } else {
                renderTextPixel("");
                rightTapBtn.style.display = 'none';
                showCard();
            }
        }

        function nextSequenceStep() {
            seqIndex++;
            playNextMainSequence();
        }

        // Slide Dialogue System
        let currentSlide = 0;
        const slides = [
            { 
                title: "✨ 100 Weeks & 700 Days ✨", 
                desc: "আয়েশা (AHUBATI), ১০০ টি সপ্তাহ এবং ৭০০ টি দিন ধরে আমার পাশে থাকার জন্য অনেক ধন্যবাদ।" 
            },
            { 
                title: "💖 For My Special One 💖", 
                desc: "You are my JAPAN without P! 🥰 (You are my JAAN ❤️)" 
            },
            { 
                title: "🌸 Pure Happiness 🌸", 
                desc: "জীবনের প্রতিটি মুহূর্ত তোমার ভালোবাসা দিয়ে সুন্দর করার জন্য আমি চিরকৃতজ্ঞ।" 
            },
            { 
                title: "✨ Custom Slot 1 ✨", 
                desc: "এখানে আপনার নিজের মতো যেকোনো লাইন কোড থেকে লিখে নিতে পারবেন।" 
            },
            { 
                title: "💍 Forever & Always 💍", 
                desc: "সারাটা জীবন কি এভাবেই পাশে থাকবে? ❤️"
            }
        ];

        const cardEl = document.getElementById('mainCard');
        const titleEl = document.getElementById('cardTitle');
        const descEl = document.getElementById('cardDesc');

        function showCard() {
            cardEl.style.display = 'block';
            updateCard();
        }

        function updateCard() {
            titleEl.innerText = slides[currentSlide].title;
            descEl.innerText = slides[currentSlide].desc;

            if (currentSlide === slides.length - 1) {
                document.getElementById('nextBtn').innerText = "YES, ALWAYS! 💖";
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateCard();
            } else {
                titleEl.innerText = "Yayyy! 🎉❤️";
                descEl.innerText = "Welcome to our forever journey, Ayesha + Sadik! 🥰✨";
                document.getElementById('btnContainer').innerHTML = `<button class="btn-custom">FOREVER TOGETHER ❤️</button>`;
            }
        }

        // Touch Swipe Left Gesture
        let touchStartX = 0;
        cardEl.addEventListener('touchstart', (e) => touchStartX = e.touches[0].clientX);
        cardEl.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].clientX;
            if (touchStartX - touchEndX > 50) nextSlide();
        });
    </script>
</body>
</html>
