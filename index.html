<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ayesha + Sadik ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ---------- PULL SCREEN ---------- */
        #pull-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: none;
            transition: opacity 1s ease;
        }

        .cord-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 55px;
        }

        .cord-line {
            width: 4px;
            height: 260px;
            background: linear-gradient(to bottom, #ffd700, #00f2fe, #ff2a85);
            box-shadow: 0 0 20px #00f2fe, 0 0 40px #ffd700;
            transition: height 0.08s ease;
        }

        .cord-handle {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle, #ffffff, #00f2fe);
            border-radius: 50%;
            box-shadow: 0 0 30px #00f2fe, 0 0 50px #ffffff;
            border: 3px solid #ffd700;
        }

        .pull-hint {
            color: #ffd700;
            margin-top: 40px;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            animation: pulseGlow 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.6;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* ---------- WELCOME SCREEN ---------- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
        }

        .welcome-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .welcome-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-title {
            font-size: 38px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 25px #00f2fe, 0 0 50px #ff2a85;
            line-height: 1.4;
            font-weight: bold;
        }

        .welcome-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            color: #ffd700;
            margin-top: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
        }

        /* ---------- CANVASES ---------- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #matrixCanvas {
            z-index: 10;
            background: #000000;
        }
        #textCanvas {
            z-index: 20;
            pointer-events: none;
        }
        #fireworksCanvas {
            z-index: 30;
            pointer-events: none;
        }
        #heartsCanvas {
            z-index: 15;
            pointer-events: none;
        }

        /* ---------- RIGHT TAP BUTTON ---------- */
        .right-tap-btn {
            position: fixed;
            right: 22px;
            bottom: 38%;
            width: 72px;
            height: 72px;
            background: radial-gradient(circle, #00f2fe, #007799);
            border: 3px solid #ffd700;
            border-radius: 50%;
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.9), inset 0 0 15px #fff;
            cursor: pointer;
            z-index: 500;
            animation: floatBtn 2s infinite alternate ease-in-out;
            text-align: center;
            line-height: 1.2;
        }

        @keyframes floatBtn {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-15px);
            }
        }

        /* ---------- CARD CONTAINER (ENHANCED BORDERS) ---------- */
        .card-container {
            position: relative;
            z-index: 600;
            background: rgba(6, 10, 20, 0.95);
            border: 3px solid #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.6), inset 0 0 30px rgba(0, 242, 254, 0.15);
            outline: 3px solid #ffd700;
            outline-offset: -12px;
            border-radius: 20px;
            padding: 38px 28px 32px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            backdrop-filter: blur(18px);
            display: none;
            cursor: pointer;
            animation: popup 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .corner-ornament {
            position: absolute;
            width: 38px;
            height: 38px;
            fill: #ffd700;
            filter: drop-shadow(0 0 8px #ffd700);
        }
        .top-left {
            top: 8px;
            left: 8px;
        }
        .top-right {
            top: 8px;
            right: 8px;
            transform: scaleX(-1);
        }
        .bottom-left {
            bottom: 8px;
            left: 8px;
            transform: scaleY(-1);
        }
        .bottom-right {
            bottom: 8px;
            right: 8px;
            transform: scale(-1);
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #00f2fe;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
            min-height: 50px;
        }

        .marry-me-title {
            font-family: 'Playfair Display', serif !important;
            font-style: italic;
            font-size: 34px !important;
            color: #ffd700 !important;
            text-shadow: 0 0 30px #ffd700, 0 0 45px #ff2a85 !important;
        }

        .card-desc {
            font-size: 16px;
            color: #e0f7fa;
            line-height: 1.8;
            margin-bottom: 18px;
            font-weight: 300;
            min-height: 60px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* ----- Image Slide inside Card (Enhanced) ----- */
        .card-image-wrap {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            margin: 14px 0 18px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            position: relative;
            background: #111;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card-image-wrap:hover {
            transform: scale(1.01);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.6);
        }

        .card-image-wrap img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .card-image-wrap img:hover {
            transform: scale(1.03);
        }

        .img-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 24px 12px 14px;
            color: #fff;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            text-shadow: 0 0 15px #000;
        }

        /* ----- 3D HEART ANIMATION (from snippet) ----- */
        #heartContainer {
            width: 100%;
            height: 250px;
            position: relative;
            display: none;
            perspective: 600px;
            margin: 10px 0;
        }

        .heart-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spinHeart 20s infinite linear;
        }

        @keyframes spinHeart {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .love {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: rotateY(calc(var(--i) * (360deg / var(--total)))) translateZ(140px);
            width: 120px;
            height: 40px;
            margin-left: -60px;
            margin-top: -20px;
            pointer-events: none;
        }

        .love_horizontal {
            transform: rotateX(25deg);
            transform-style: preserve-3d;
        }

        .love_vertical {
            transform: rotateY(15deg);
            transform-style: preserve-3d;
        }

        .love_word {
            color: #ff2a85;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 0 15px #ff2a85, 0 0 30px #00f2fe;
            white-space: nowrap;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
            transform: translateX(-50%);
        }

        .tap-card-hint {
            font-size: 14px;
            color: #ffd700;
            margin-top: 14px;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-yes {
            background: linear-gradient(45deg, #00f2fe, #ffd700);
            color: #000;
            border: none;
            padding: 16px 38px;
            font-size: 18px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.9);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .btn-yes:active {
            transform: scale(0.92);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
        }

        .btn-action {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.7);
            transition: transform 0.2s;
        }
        .btn-action:active {
            transform: scale(0.94);
        }

        .btn-exit {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #fff;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .welcome-title {
                font-size: 28px;
            }
            .card-title {
                font-size: 20px;
            }
            .marry-me-title {
                font-size: 26px !important;
            }
            .card-desc {
                font-size: 14px;
            }
            .right-tap-btn {
                width: 62px;
                height: 62px;
                font-size: 12px;
                right: 12px;
            }
            .cord-line {
                height: 200px;
            }
            .pull-hint {
                font-size: 15px;
                margin-top: 30px;
            }
            .card-container {
                padding: 28px 16px 24px;
            }
            .corner-ornament {
                width: 28px;
                height: 28px;
            }
            .love {
                transform: rotateY(calc(var(--i) * (360deg / var(--total)))) translateZ(100px);
                width: 80px;
                height: 30px;
                margin-left: -40px;
                margin-top: -15px;
            }
            .love_word {
                font-size: 14px;
            }
            #heartContainer {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PULL SCREEN ===== -->
    <div id="pull-screen">
        <div class="cord-wrapper" id="cordWrapper">
            <div class="cord-line" id="cordLine"></div>
            <div class="cord-handle"></div>
        </div>
        <div class="pull-hint">⬇ PULL DOWN TO BEGIN ✨</div>
    </div>

    <!-- ===== WELCOME SCREEN ===== -->
    <div id="welcome-screen">
        <div class="welcome-content" id="welRow1">
            <div class="welcome-title">Hey 𝔸𝕪𝕖𝕤𝕙𝕒, My Love ❤️</div>
        </div>
        <div class="welcome-content" id="welRow2">
            <div class="welcome-subtitle">✨ WELCOME, THIS IS FOR YOU ✨</div>
        </div>
    </div>

    <!-- ===== CANVASES ===== -->
    <canvas id="matrixCanvas"></canvas>
    <canvas id="heartsCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <!-- ===== TAP BUTTON ===== -->
    <div id="rightTapBtn" class="right-tap-btn" onclick="nextSequenceStep()">TAP<br/>❤️</div>

    <!-- ===== MAIN CARD ===== -->
    <div id="mainCard" class="card-container" onclick="handleCardClick()">
        <!-- Corner ornaments -->
        <svg class="corner-ornament top-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament top-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>

        <h2 id="cardTitle" class="card-title"></h2>

        <!-- Image placeholder -->
        <div id="cardImageWrap" class="card-image-wrap" style="display:none;">
            <img id="cardImage" src="" alt="Ayesha & Sadik" />
            <div class="img-caption" id="imgCaption">💕</div>
        </div>

        <!-- 3D Heart Container -->
        <div id="heartContainer">
            <div class="heart-scene" id="heartScene"></div>
        </div>

        <p id="cardDesc" class="card-desc"></p>

        <div id="actionArea">
            <div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>
        </div>
    </div>

    <!-- ===== AUDIO ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg" />
    </audio>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ============================================================
        //  1. CANVAS SETUP
        // ============================================================
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const textCanvas = document.getElementById('textCanvas');
        const tCtx = textCanvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        const heartsCanvas = document.getElementById('heartsCanvas');
        const hCtx = heartsCanvas.getContext('2d');

        const pullScreen = document.getElementById('pull-screen');
        const cordWrapper = document.getElementById('cordWrapper');
        const cordLine = document.getElementById('cordLine');
        const welcomeScreen = document.getElementById('welcome-screen');
        const welRow1 = document.getElementById('welRow1');
        const welRow2 = document.getElementById('welRow2');
        const bgMusic = document.getElementById('bgMusic');
        const rightTapBtn = document.getElementById('rightTapBtn');

        let W, H;

        function resizeAll() {
            W = window.innerWidth;
            H = window.innerHeight;
            matrixCanvas.width = textCanvas.width = fwCanvas.width = heartsCanvas.width = W;
            matrixCanvas.height = textCanvas.height = fwCanvas.height = heartsCanvas.height = H;
            initMatrixColumns();
        }
        window.addEventListener('resize', resizeAll);

        // ============================================================
        //  2. MATRIX RAIN
        // ============================================================
        const rainPhrases = [
            "100 WEEKS ", "700 DAYS ", "AYESHA ",
            "AHUBATI ", "I LOVE YOU ", "SADIK "
        ];
        let fontSize = 16;
        let columns = 0;
        let drops = [];

        function initMatrixColumns() {
            columns = Math.floor(W / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                const phrase = rainPhrases[i % rainPhrases.length];
                drops[i] = {
                    y: Math.random() * -60,
                    speed: 0.20 + Math.random() * 0.25,
                    phrase: phrase,
                    charIndex: Math.floor(Math.random() * phrase.length)
                };
            }
        }
        resizeAll();

        function drawMatrixBG() {
            mCtx.fillStyle = '#000000';
            mCtx.fillRect(0, 0, W, H);
            mCtx.font = 'bold 15px monospace';

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                const trailLen = 8;
                for (let j = 0; j < trailLen; j++) {
                    const charY = (drop.y - j) * fontSize;
                    if (charY < 0 || charY > H) continue;
                    const idx = (drop.charIndex - j + drop.phrase.length * 100) % drop.phrase.length;
                    const char = drop.phrase[idx];
                    if (j === 0) {
                        mCtx.fillStyle = '#ffffff';
                        mCtx.shadowColor = '#00f2fe';
                        mCtx.shadowBlur = 8;
                    } else {
                        const alpha = 1 - (j / trailLen);
                        mCtx.fillStyle = `rgba(255, 42, 133, ${alpha})`;
                        mCtx.shadowBlur = 0;
                    }
                    const x = i * fontSize;
                    mCtx.fillText(char, x, charY);
                }
                drop.y += drop.speed;
                drop.charIndex++;
                if (drop.y * fontSize > H + 150) {
                    drop.y = Math.random() * -20;
                    drop.speed = 0.20 + Math.random() * 0.25;
                }
            }
        }
        let matrixInterval = setInterval(drawMatrixBG, 40);

        // ============================================================
        //  3. FLOATING HEARTS CANVAS
        // ============================================================
        let heartParticles = [];

        function spawnHeartBurst(cx, cy, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                heartParticles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    size: 12 + Math.random() * 20,
                    alpha: 0.9 + Math.random() * 0.1,
                    life: 1,
                    decay: 0.005 + Math.random() * 0.008,
                    color: `hsl(${330 + Math.random() * 40}, 90%, 60%)`
                });
            }
        }

        function drawHeartsCanvas() {
            hCtx.clearRect(0, 0, W, H);
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const p = heartParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.04;
                p.life -= p.decay;
                p.alpha = p.life * 0.9;
                if (p.life <= 0) { heartParticles.splice(i, 1); continue; }
                hCtx.globalAlpha = p.alpha;
                hCtx.font = `${p.size}px serif`;
                hCtx.textAlign = 'center';
                hCtx.textBaseline = 'middle';
                hCtx.fillStyle = p.color || '#ff2a85';
                hCtx.shadowColor = '#ff2a85';
                hCtx.shadowBlur = 20;
                hCtx.fillText('♥', p.x, p.y);
            }
            hCtx.globalAlpha = 1;
            hCtx.shadowBlur = 0;
            if (heartParticles.length > 0) requestAnimationFrame(drawHeartsCanvas);
        }

        function triggerHeartBurst(x, y) {
            spawnHeartBurst(x || W / 2, y || H / 2, 30);
            if (heartParticles.length > 0) drawHeartsCanvas();
        }

        setInterval(() => {
            if (document.getElementById('pull-screen').style.display === 'none') {
                const x = Math.random() * W;
                const y = Math.random() * H * 0.6 + 50;
                spawnHeartBurst(x, y, 10 + Math.random() * 15);
                if (heartParticles.length > 0) drawHeartsCanvas();
            }
        }, 2800);

        // ============================================================
        //  4. FIREWORKS
        // ============================================================
        let particles = [];

        function triggerBurstFireworks(cx, cy) {
            const centerX = cx || W / 2;
            const centerY = cy || H * 0.4;
            const colors = ['#ffd700', '#00f2fe', '#ff2a85', '#ffffff', '#ff6b6b', '#feca57'];
            for (let i = 0; i < 55; i++) {
                const angle = (Math.PI * 2 / 55) * i + Math.random() * 0.2;
                const speed = Math.random() * 5 + 3;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2 + Math.random() * 3.5
                });
            }
            animateFireworks();
        }

        function animateFireworks() {
            if (particles.length === 0) return;
            fwCtx.clearRect(0, 0, W, H);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.alpha -= 0.018;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color;
                fwCtx.globalAlpha = p.alpha;
                fwCtx.shadowColor = p.color;
                fwCtx.shadowBlur = 14;
                fwCtx.fill();
                if (p.alpha <= 0) particles.splice(idx, 1);
            });
            fwCtx.globalAlpha = 1;
            fwCtx.shadowBlur = 0;
            if (particles.length > 0) requestAnimationFrame(animateFireworks);
        }

        // ============================================================
        //  5. PULL MECHANISM
        // ============================================================
        let startY = 0,
            currentDrag = 0;
        const maxDrag = 170;

        cordWrapper.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });
        cordWrapper.addEventListener('touchmove', (e) => {
            const y = e.touches[0].clientY;
            currentDrag = Math.max(0, Math.min(maxDrag, y - startY));
            cordLine.style.height = (260 + currentDrag) + 'px';
            if (currentDrag >= maxDrag) triggerSystemStart();
        });
        cordWrapper.addEventListener('touchend', () => {
            if (currentDrag < maxDrag) cordLine.style.height = '260px';
        });
        cordWrapper.addEventListener('click', () => triggerSystemStart());

        // ============================================================
        //  6. SYSTEM START
        // ============================================================
        let isStarted = false;

        function triggerSystemStart() {
            if (isStarted) return;
            isStarted = true;
            bgMusic.play().catch(() => {});
            pullScreen.style.opacity = '0';
            setTimeout(() => {
                pullScreen.style.display = 'none';
                welcomeScreen.style.display = 'flex';
                triggerBurstFireworks();
                triggerHeartBurst(W / 2, H * 0.5);
                setTimeout(() => {
                    welRow1.classList.add('show');
                    triggerBurstFireworks();
                    triggerHeartBurst(W / 2, H * 0.3);
                }, 400);
                setTimeout(() => {
                    welRow2.classList.add('show');
                    triggerBurstFireworks();
                    triggerHeartBurst(W / 2, H * 0.6);
                }, 2000);
                setTimeout(() => {
                    welcomeScreen.style.opacity = '0';
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        startCountdownSequence();
                    }, 1500);
                }, 5200);
            }, 800);
        }

        // ============================================================
        //  7. TEXT RENDER (Pixel Dot)
        // ============================================================
        function renderTextPixel(text) {
            tCtx.clearRect(0, 0, W, H);
            if (!text) return;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = W;
            tempCanvas.height = H;
            let dynSize = Math.min(W / (text.length * 0.65), H * 0.22);
            if (dynSize > 85) dynSize = 85;
            if (dynSize < 24) dynSize = 24;
            tempCtx.fillStyle = '#fff';
            tempCtx.font = `900 ${dynSize}px sans-serif`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(text, W / 2, H / 2);
            const imgData = tempCtx.getImageData(0, 0, W, H);
            const data = imgData.data;
            const dotGap = 7;
            const dotRadius = 2.8;
            tCtx.fillStyle = '#00f2fe';
            tCtx.shadowColor = '#00f2fe';
            tCtx.shadowBlur = 18;
            for (let y = 0; y < H; y += dotGap) {
                for (let x = 0; x < W; x += dotGap) {
                    const idx = (y * W + x) * 4;
                    if (data[idx + 3] > 128) {
                        tCtx.beginPath();
                        tCtx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        tCtx.fill();
                    }
                }
            }
            tCtx.shadowBlur = 0;
        }

        // ============================================================
        //  8. SEQUENCE (Countdown + Main)
        // ============================================================
        const mainSequence = [
            "100 WEEKS",
            "700 DAYS",
            "AYESHA + SADIK",
            "AHUBATI + AHUBI",
            "I LOVE YOU"
        ];
        let seqIndex = 0;

        function startCountdownSequence() {
            rightTapBtn.style.display = 'none';
            renderTextPixel('3');
            triggerBurstFireworks();
            triggerHeartBurst(W / 2, H / 2);
            setTimeout(() => {
                renderTextPixel('2');
                triggerBurstFireworks();
                triggerHeartBurst(W / 2, H / 2);
                setTimeout(() => {
                    renderTextPixel('1');
                    triggerBurstFireworks();
                    triggerHeartBurst(W / 2, H / 2);
                    setTimeout(() => {
                        seqIndex = 0;
                        rightTapBtn.style.display = 'flex';
                        playNextMainSequence();
                    }, 850);
                }, 850);
            }, 850);
        }

        function playNextMainSequence() {
            if (seqIndex < mainSequence.length) {
                renderTextPixel(mainSequence[seqIndex]);
                triggerBurstFireworks();
                triggerHeartBurst(W / 2, H / 2);
            } else {
                renderTextPixel('');
                rightTapBtn.style.display = 'none';
                showCard();
            }
        }

        function nextSequenceStep() {
            seqIndex++;
            playNextMainSequence();
        }

        // ============================================================
        //  9. CARD with IMAGE SLIDES + HEART ANIMATION SLIDE
        // ============================================================
        // ─── 🔽 REPLACE THESE URLs WITH YOUR OWN IMAGES ───
        const IMAGE_1 =
            'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&h=600&fit=crop';
        const IMAGE_2 =
            'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=800&h=600&fit=crop';
        const IMAGE_3 =
            'https://images.unsplash.com/photo-1504544750208-dc0358e63f7f?w=800&h=600&fit=crop';
        const IMAGE_4 =
            'https://images.unsplash.com/photo-1519741497674-611481863552?w=800&h=600&fit=crop';
        // ─── 🔼 REPLACE ABOVE WITH YOUR OWN IMAGE URLs ───

        const slides = [{
            title: '✨ 100 Weeks & 700 Days ✨',
            desc: 'আয়েশা (AHUBATI), ১০০ টি সপ্তাহ এবং ৭০০ টি দিন ধরে আমার পাশে থাকার জন্য অনেক ধন্যবাদ।',
            hasImage: false
        }, {
            title: '💖 For My Special One 💖',
            desc: 'You are my JAPAN without P! 🥰 (You are my JAAN ❤️)',
            hasImage: false
        }, {
            title: '🌸 Our Beautiful Moments 🌸',
            desc: 'তোমার সাথে কাটানো প্রতিটি মুহূর্ত আমার কাছে অমূল্য। 💕',
            hasImage: true,
            imgSrc: IMAGE_1,
            imgCaption: '💕 তোমার হাসি আমার পৃথিবী 💕'
        }, {
            title: '🌅 Forever Together 🌅',
            desc: 'জীবনের পথে তুমি আমার সবচেয়ে সুন্দর গন্তব্য।',
            hasImage: true,
            imgSrc: IMAGE_2,
            imgCaption: '🌹 চিরকাল তোমার সাথেই 🌹'
        }, {
            title: '💫 Stars in Your Eyes 💫',
            desc: 'তোমার চোখে আমি আমার পুরো আকাশ দেখতে পাই। ✨',
            hasImage: true,
            imgSrc: IMAGE_3,
            imgCaption: '🌟 তুমি আমার নক্ষত্র 🌟'
        }, {
            title: '🌹 My One and Only 🌹',
            desc: 'এই পৃথিবীতে তুমিই আমার সবচেয়ে প্রিয় মানুষ। ❤️',
            hasImage: true,
            imgSrc: IMAGE_4,
            imgCaption: '💍 শুধু তুমিই 💍'
        }, {
            // NEW SLIDE: 3D HEART ANIMATION (S + A)
            title: 'S + A ❤️',
            desc: '', // description hidden, heart takes over
            hasHeartAnimation: true
        }, {
            title: '💍 Will You Marry Me? 💍',
            desc: 'আমার জীবনের বাকিটা সময় কি এভাবেই নিজের করে নিবে? Will you marry me, my love? ❤️',
            hasImage: false,
            isMarryPage: true
        }];

        let currentSlide = 0;
        const cardEl = document.getElementById('mainCard');
        const titleEl = document.getElementById('cardTitle');
        const descEl = document.getElementById('cardDesc');
        const actionArea = document.getElementById('actionArea');
        const cardImageWrap = document.getElementById('cardImageWrap');
        const cardImage = document.getElementById('cardImage');
        const imgCaption = document.getElementById('imgCaption');
        const heartContainer = document.getElementById('heartContainer');
        const heartScene = document.getElementById('heartScene');

        let heartsGenerated = false;

        function generateHearts() {
            if (heartsGenerated) return;
            const total = 36;
            heartScene.style.setProperty('--total', total);
            for (let i = 1; i <= total; i++) {
                const love = document.createElement('div');
                love.className = 'love';
                love.style.setProperty('--i', i);
                love.innerHTML = `
                    <div class="love_horizontal">
                        <div class="love_vertical">
                            <div class="love_word">I love you</div>
                        </div>
                    </div>
                `;
                heartScene.appendChild(love);
            }
            heartsGenerated = true;
        }

        function showHeartAnimation(show) {
            if (show) {
                heartContainer.style.display = 'block';
                if (!heartsGenerated) generateHearts();
                // ensure scene is visible
                heartScene.style.display = 'block';
            } else {
                heartContainer.style.display = 'none';
            }
        }

        function showCard() {
            cardEl.style.display = 'block';
            currentSlide = 0;
            updateCard();
            triggerBurstFireworks();
            triggerHeartBurst(W / 2, H / 2);
            setTimeout(() => triggerHeartBurst(W / 2, H / 2 + 80), 400);
        }

        function updateCard() {
            const slide = slides[currentSlide];
            titleEl.innerText = slide.title;
            descEl.innerText = slide.desc || '';

            // Handle heart animation slide
            if (slide.hasHeartAnimation) {
                cardImageWrap.style.display = 'none';
                showHeartAnimation(true);
                descEl.style.display = 'none'; // hide description
                // No image, no description, just hearts
            } else {
                showHeartAnimation(false);
                descEl.style.display = 'block';
                // Handle image
                if (slide.hasImage && slide.imgSrc) {
                    cardImageWrap.style.display = 'block';
                    cardImage.src = slide.imgSrc;
                    cardImage.alt = 'Ayesha & Sadik';
                    imgCaption.innerText = slide.imgCaption || '💕';
                } else {
                    cardImageWrap.style.display = 'none';
                }
            }

            // Marry page special
            if (slide.isMarryPage) {
                titleEl.classList.add('marry-me-title');
                actionArea.innerHTML = `
                    <div class="btn-group">
                        <button class="btn-yes" onclick="handleYesClick(event)">Yes, I Will! 💍💖</button>
                    </div>
                `;
                setTimeout(() => triggerBurstFireworks(), 300);
                setTimeout(() => triggerHeartBurst(W / 2, H / 2), 500);
            } else {
                titleEl.classList.remove('marry-me-title');
                actionArea.innerHTML = `<div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>`;
            }

            triggerHeartBurst(W / 2, H / 2);
        }

        function handleCardClick() {
            if (!slides[currentSlide].isMarryPage) {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    updateCard();
                    triggerBurstFireworks();
                }
            }
        }

        function handleYesClick(e) {
            e.stopPropagation();
            titleEl.innerText = '🎉 FOREVER & ALWAYS 🎉';
            descEl.innerText =
                'I Love You So Much 𝔸𝕪𝕖𝕤𝕙𝕒! ❤️ আপনার সাথে সারা জীবন কাটানোর জন্য অপেক্ষায় রইলাম।';
            cardImageWrap.style.display = 'none';
            showHeartAnimation(false);
            descEl.style.display = 'block';
            titleEl.classList.add('marry-me-title');
            triggerBurstFireworks();
            triggerHeartBurst(W / 2, H / 2);
            setTimeout(() => triggerBurstFireworks(), 500);
            setTimeout(() => triggerHeartBurst(W / 2, H / 2 + 100), 700);

            actionArea.innerHTML = `
                <div class="btn-group">
                    <button class="btn-action" onclick="replayProject(event)">REPLAY 🔄</button>
                    <button class="btn-action btn-exit" onclick="exitProject(event)">EXIT ❌</button>
                </div>
            `;
        }

        function replayProject(e) {
            e.stopPropagation();
            cardEl.style.display = 'none';
            pullScreen.style.display = 'flex';
            pullScreen.style.opacity = '1';
            cordLine.style.height = '260px';
            welRow1.classList.remove('show');
            welRow2.classList.remove('show');
            isStarted = false;
            currentDrag = 0;
            seqIndex = 0;
            heartParticles = [];
            particles = [];
            initMatrixColumns();
            tCtx.clearRect(0, 0, W, H);
            fwCtx.clearRect(0, 0, W, H);
            hCtx.clearRect(0, 0, W, H);
            rightTapBtn.style.display = 'none';
            bgMusic.pause();
            bgMusic.currentTime = 0;
            // reset heart scene display
            heartContainer.style.display = 'none';
            heartsGenerated = false;
            heartScene.innerHTML = ''; // clear generated hearts
        }

        function exitProject(e) {
            e.stopPropagation();
            alert('Thank you for being in my life! ❤️ Stay forever blessed.');
            window.close();
        }

        // ============================================================
        //  10. AUTO START HEARTS BACKGROUND
        // ============================================================
        setInterval(() => {
            if (pullScreen.style.display !== 'none') {
                const x = Math.random() * W;
                const y = 100 + Math.random() * 200;
                spawnHeartBurst(x, y, 6 + Math.random() * 10);
                if (heartParticles.length > 0) drawHeartsCanvas();
            }
        }, 4000);

        // ============================================================
        //  11. KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                if (pullScreen.style.display !== 'none') triggerSystemStart();
                else if (rightTapBtn.style.display === 'flex') nextSequenceStep();
                else if (cardEl.style.display === 'block') handleCardClick();
            }
        });

        console.log('❤️ Ayesha + Sadik ❤️');
        console.log('Replace IMAGE_1, IMAGE_2, IMAGE_3, IMAGE_4 with your own photos!');
    </script>
