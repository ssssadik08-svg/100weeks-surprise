<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A special gift for Ayesha - Celebrating our love story" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* ========================================
           CSS RESET & BASE STYLES
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            color: #ffffff;
        }

        /* ========================================
           PULL CORD SCREEN - ENHANCED
           ======================================== */
        #pull-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a12 0%, #050508 100%);
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: none;
            transition: opacity 1s ease, transform 1s ease;
        }

        .cord-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            transition: transform 0.3s ease;
        }

        .cord-wrapper:active {
            transform: scale(0.98);
        }

        .cord-line {
            width: 8px;
            height: 240px;
            background: linear-gradient(180deg, 
                #00f2fe 0%, 
                #4facfe 25%, 
                #ffd700 50%, 
                #ff2a85 75%, 
                #00f2fe 100%);
            box-shadow: 
                0 0 20px rgba(0, 242, 254, 0.8),
                0 0 40px rgba(255, 42, 133, 0.6),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: height 0.1s ease, box-shadow 0.3s ease;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .cord-line::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(200%); }
        }

        .cord-handle {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 30% 30%, 
                #ffffff 0%, 
                #00f2fe 40%, 
                #0080ff 70%, 
                #004080 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 30px rgba(0, 242, 254, 0.9),
                0 0 60px rgba(0, 242, 254, 0.6),
                0 0 90px rgba(0, 242, 254, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cord-handle::after {
            content: '❤️';
            font-size: 28px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .pull-hint {
            color: #00f2fe;
            margin-top: 40px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-align: center;
            text-shadow: 
                0 0 15px rgba(0, 242, 254, 0.8),
                0 0 30px rgba(0, 242, 254, 0.5);
            animation: pulseCyan 2s infinite alternate ease-in-out;
            padding: 0 20px;
        }

        @keyframes pulseCyan {
            0% { 
                opacity: 0.6; 
                transform: scale(0.98) translateY(0);
            }
            100% { 
                opacity: 1; 
                transform: scale(1.02) translateY(-3px);
            }
        }

        /* ========================================
           WELCOME SCREEN - ENHANCED
           ======================================== */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a12 0%, #050508 100%);
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
        }

        .welcome-content {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .welcome-content.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .welcome-title {
            font-size: clamp(28px, 8vw, 42px);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 
                0 0 20px rgba(0, 242, 254, 0.8),
                0 0 40px rgba(255, 42, 133, 0.6);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .welcome-subtitle {
            font-size: clamp(14px, 4vw, 18px);
            color: #00f2fe;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.9);
            font-weight: 600;
        }

        /* ========================================
           CANVAS LAYERS
           ======================================== */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #matrixCanvas { z-index: 10; }
        #heartsCanvas { z-index: 15; }
        #textCanvas { z-index: 20; }
        #fireworksCanvas { z-index: 30; }

        /* ========================================
           FLOATING ACTION BUTTON
           ======================================== */
        .right-tap-btn {
            position: fixed;
            right: 20px;
            bottom: 35%;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00f2fe 0%, #0080ff 100%);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 
                0 0 30px rgba(0, 242, 254, 0.9),
                0 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            z-index: 500;
            animation: floatBtn 2.5s infinite alternate ease-in-out;
            text-align: center;
            line-height: 1.2;
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        /* ========================================
           MAIN CARD CONTAINER - REDESIGNED
           ======================================== */
        .card-container {
            position: relative;
            z-index: 600;
            background: linear-gradient(135deg, 
                rgba(15, 15, 25, 0.96) 0%, 
                rgba(10, 10, 18, 0.98) 100%);
            border: 2px solid rgba(0, 242, 254, 0.4);
            box-shadow: 
                0 0 40px rgba(0, 242, 254, 0.3),
                0 0 80px rgba(0, 242, 254, 0.15);
            border-radius: 20px;
            padding: 30px 20px;
            width: 94%;
            max-width: 520px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            cursor: pointer;
            animation: popup 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            max-height: 85vh;
            overflow-y: auto;
        }

        .card-container::-webkit-scrollbar {
            width: 6px;
        }

        .card-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .card-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00f2fe, #0080ff);
            border-radius: 3px;
        }

        @keyframes popup {
            from { 
                opacity: 0; 
                transform: scale(0.8) translateY(30px);
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0);
            }
        }

        .card-title {
            font-size: clamp(20px, 6vw, 26px);
            font-weight: 700;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .marry-me-title {
            font-size: clamp(24px, 7vw, 32px) !important;
            color: #ffd700 !important;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 0.9),
                0 0 40px rgba(255, 42, 133, 0.7) !important;
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.9); }
            100% { text-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }

        .card-desc {
            font-size: clamp(13px, 4vw, 16px);
            color: #e8e8e8;
            line-height: 1.7;
            margin-bottom: 18px;
            font-weight: 400;
        }

        /* ========================================
           IMAGE GALLERY
           ======================================== */
        .card-image-wrap {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0 20px;
            border: 2px solid rgba(255, 215, 0, 0.6);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            background: #111;
        }

        .card-image-wrap img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            display: block;
        }

        .img-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.9) 100%);
            padding: 50px 15px 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        /* ========================================
           3D HEART CONTAINER
           ======================================== */
        #heartContainer {
            width: 100%;
            height: 240px;
            position: relative;
            display: none;
            perspective: 1000px;
            margin: 15px 0;
        }

        .heart-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateHeart 16s infinite linear;
        }

        @keyframes rotateHeart {
            0% { transform: rotateY(0deg) rotateX(8deg); }
            100% { transform: rotateY(360deg) rotateX(8deg); }
        }

        .love-item {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #ff2a85;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 42, 133, 0.9);
            transform-origin: center center;
        }

        /* ========================================
           HEART TREE WIDGET
           ======================================== */
        #treeContainer {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .tree-layout {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .tree-text-box {
            width: 50%;
            text-align: left;
            font-size: 12px;
            line-height: 1.8;
            color: #ffd700;
            font-weight: 500;
        }

        .tree-canvas-box {
            width: 50%;
            height: 200px;
            position: relative;
        }

        #treeCanvas {
            width: 100%;
            height: 100%;
        }

        .clock-box {
            margin-top: 15px;
            font-size: 14px;
            color: #00f2fe;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(0, 128, 255, 0.1) 100%);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.4);
            font-weight: 600;
        }

        /* ========================================
           NEON HEART CONTAINER
           ======================================== */
        #neonHeartContainer {
            width: 100%;
            height: 240px;
            display: none;
            position: relative;
            margin: 15px 0;
        }

        #neonCanvas {
            width: 100%;
            height: 100%;
        }

        /* ========================================
           INTERACTIVE BUTTONS
           ======================================== */
        .tap-card-hint {
            font-size: 14px;
            color: #00f2fe;
            margin-top: 15px;
            letter-spacing: 1.5px;
            animation: pulseCyan 2s infinite alternate;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff2a85 0%, #ffd700 100%);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: 800;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.8);
            transition: all 0.3s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-action {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-home { 
            background: linear-gradient(135deg, #ffd700 0%, #ff8800 100%);
        }

        /* ========================================
           MUSIC PLAYER
           ======================================== */
        .music-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 700;
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.95) 0%, rgba(10, 10, 18, 0.98) 100%);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 50px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(10px);
        }

        .music-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #0080ff);
            border: 2px solid #fff;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .music-btn:active {
            transform: scale(0.9);
        }

        .music-info {
            color: #00f2fe;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            max-width: 150px;
        }

        /* ========================================
           PROGRESS INDICATOR
           ======================================== */
        .progress-dots {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 700;
            display: none;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.3);
            border: 2px solid rgba(0, 242, 254, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #00f2fe;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.9);
            transform: scale(1.3);
        }

        /* ========================================
           LOADING SPINNER
           ======================================== */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            display: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 242, 254, 0.2);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========================================
           RESPONSIVE DESIGN
           ======================================== */
        @media (max-width: 480px) {
            .welcome-title { font-size: 26px; }
            .card-title { font-size: 20px; }
            .marry-me-title { font-size: 26px !important; }
            .card-desc { font-size: 14px; }
            .right-tap-btn { width: 60px; height: 60px; font-size: 11px; }
            .card-container { padding: 25px 15px; width: 96%; }
            .tree-layout { flex-direction: column; }
            .tree-text-box, .tree-canvas-box { width: 100%; }
        }
    </style>
</head>

        // ============================================

        let W = window.innerWidth, H = window.innerHeight;

        // ============================================
        // 4. INITIALIZATION
        // ============================================
        
        /** Initialize all systems */
        function init() {
            try {
                setupCanvasSizes();
                initMatrixColumns();
                setupEventListeners();
                startRelationshipClock();
                showLoading(false);
                console.log('✅ App initialized');
            } catch (err) {
                console.error('❌ Init error:', err);
                showLoading(false);
            }

        /** Setup canvas sizes */
        function setupCanvasSizes() {
            W = window.innerWidth;
            H = window.innerHeight;
            Object.values(canvases).forEach(c => { if(c) { c.width = W; c.height = H; } });
        }

        /** Setup event listeners */

            // Resize with debounce
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);

                    setupCanvasSizes();

        // ============================================
        // 5. MATRIX RAIN ANIMATION
        // ============================================
        
        const rainPhrases = ["100 WEEKS ", "700 DAYS ", "ᴀʏᴇꜱʜᴀ ", "AHUBATI ", "I LOVE YOU ", "ꜱᴀᴅɪᴋ "];
        let matrixState = { fontSize: 15, columns: 0, drops: [] };

        /** Initialize matrix columns */
        function initMatrixColumns() {
            try {
                matrixState.columns = Math.floor(W / matrixState.fontSize);
                matrixState.drops = [];
                for (let i = 0; i < matrixState.columns; i++) {
                    const phrase = rainPhrases[i % rainPhrases.length];
                    matrixState.drops[i] = {
                        y: Math.random() * -60,
                        speed: 0.20 + Math.random() * 0.25,
                        phrase: phrase,
                        charIndex: Math.floor(Math.random() * phrase.length)
                    };
                }
            } catch (err) { console.error('Matrix init error:', err); }
        }

        /** Draw matrix rain */
        function drawMatrix() {
            try {
                ctx.matrix.fillStyle = '#050508';
                ctx.matrix.fillRect(0, 0, W, H);
                ctx.matrix.font = 'bold 14px monospace';

                for (let i = 0; i < matrixState.drops.length; i++) {
                    const drop = matrixState.drops[i];
                    for (let j = 0; j < 8; j++) {
                        const y = (drop.y - j) * matrixState.fontSize;
                        if (y < 0 || y > H) continue;
                        const idx = (drop.charIndex - j + drop.phrase.length * 100) % drop.phrase.length;
                        
                        if (j === 0) {
                            ctx.matrix.fillStyle = '#ffffff';
                            ctx.matrix.shadowColor = '#00f2fe';
                            ctx.matrix.shadowBlur = 8;
                        } else {
                            ctx.matrix.fillStyle = `rgba(0, 242, 254, ${1 - j/8})`;
                            ctx.matrix.shadowBlur = 0;
                        }
                        ctx.matrix.fillText(drop.phrase[idx], i * matrixState.fontSize, y);
                    }
                    drop.y += drop.speed;
                    drop.charIndex++;
                    if (drop.y * matrixState.fontSize > H + 150) {
                        drop.y = Math.random() * -20;
                        drop.speed = 0.20 + Math.random() * 0.25;
                    }
                }
            } catch (err) { console.error('Matrix draw error:', err); }
        }

        setInterval(drawMatrix, PERFORMANCE.matrixInterval);

        // ============================================
        // 6. PARTICLE SYSTEMS
        // ============================================
        
        let heartParticles = [], fwParticles = [];

        /** Spawn heart burst */
        function spawnHearts(x, y, count) {
            try {
                const safeCount = Math.min(count, PERFORMANCE.heartParticlesLimit);
                for (let i = 0; i < safeCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 4;
                    heartParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1.2,
                        size: 12 + Math.random() * 18,
                        alpha: 0.9, life: 1,
                        decay: 0.005 + Math.random() * 0.008,
                        color: `hsl(${180 + Math.random() * 160}, 90%, 60%)`
                    });
                }
            } catch (err) { console.error('Heart spawn error:', err); }
        }

        /** Draw hearts */
        function drawHearts() {
            try {
                if (heartParticles.length === 0) return;
                ctx.hearts.clearRect(0, 0, W, H);
                
                for (let i = heartParticles.length - 1; i >= 0; i--) {
                    const p = heartParticles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.04;
                    p.life -= p.decay; p.alpha = p.life * 0.9;
                    
                    if (p.life <= 0) { heartParticles.splice(i, 1); continue; }
                    
                    ctx.hearts.globalAlpha = p.alpha;
                    ctx.hearts.font = `${p.size}px serif`;
                    ctx.hearts.textAlign = 'center';
                    ctx.hearts.fillStyle = p.color || '#00f2fe';
                    ctx.hearts.fillText('♥', p.x, p.y);
                }
                ctx.hearts.globalAlpha = 1;
                requestAnimationFrame(drawHearts);
            } catch (err) { console.error('Hearts draw error:', err); }
        }

        /** Trigger heart burst */
        function triggerHearts(x, y) {
            spawnHearts(x || W/2, y || H/2, 30);
            if (heartParticles.length > 0) drawHearts();
        }

        /** Trigger fireworks */
        function triggerFireworks(x, y) {
            try {
                const cx = x || W/2, cy = y || H*0.4;
                const colors = ['#00f2fe', '#ffd700', '#ff2a85', '#ffffff', '#00ff88'];
                
                for (let i = 0; i < 50; i++) {
                    const angle = (Math.PI * 2 / 50) * i;
                    const speed = Math.random() * 5 + 2;
                    fwParticles.push({
                        x: cx, y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 2.5 + Math.random() * 3.5
                    });
                }
                animateFireworks();
            } catch (err) { console.error('Fireworks error:', err); }
        }

        /** Animate fireworks */
        function animateFireworks() {
            try {
                if (fwParticles.length === 0) return;
                ctx.fireworks.clearRect(0, 0, W, H);
                
                for (let i = fwParticles.length - 1; i >= 0; i--) {
                    const p = fwParticles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.alpha -= 0.018;
                    
                    ctx.fireworks.beginPath();
                    ctx.fireworks.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fireworks.fillStyle = p.color;
                    ctx.fireworks.globalAlpha = p.alpha;
                    ctx.fireworks.fill();
                    
                    if (p.alpha <= 0) fwParticles.splice(i, 1);
                }
                ctx.fireworks.globalAlpha = 1;
                requestAnimationFrame(animateFireworks);
            } catch (err) { console.error('Fireworks animate error:', err); }
        }

        /** Grand celebration */
        function triggerGrandCelebration() {
            const corners = [
                {x: W*0.15, y: H*0.2}, {x: W*0.85, y: H*0.2},
                {x: W*0.15, y: H*0.7}, {x: W*0.85, y: H*0.7},
                {x: W*0.5, y: H*0.3}
            ];
            corners.forEach((c, i) => {
                setTimeout(() => { triggerFireworks(c.x, c.y); triggerHearts(c.x, c.y); }, i * 180);
            });
        }

        // ============================================
        // 7. PULL CORD
        // ============================================
        
        let cordState = { startY: 0, drag: 0, maxDrag: 150, started: false };

        /** Setup cord interaction */
        function setupCord() {
            try {
                el.cordWrapper.addEventListener('touchstart', (e) => {
                    cordState.startY = e.touches[0].clientY;
                }, { passive: true });

                el.cordWrapper.addEventListener('touchmove', (e) => {
                    const y = e.touches[0].clientY;
                    cordState.drag = Math.max(0, Math.min(cordState.maxDrag, y - cordState.startY));
                    el.cordLine.style.height = (240 + cordState.drag) + 'px';
                    if (cordState.drag >= cordState.maxDrag) startSystem();
                }, { passive: true });

                el.cordWrapper.addEventListener('touchend', () => {
                    if (cordState.drag < cordState.maxDrag) el.cordLine.style.height = '240px';
                });

                el.cordWrapper.addEventListener('click', startSystem);
            } catch (err) { console.error('Cord setup error:', err); }
        }

        /** Start system */
        function startSystem() {
            try {
                if (cordState.started) return;
                cordState.started = true;
                playMusic();
                el.pullScreen.style.opacity = '0';
                setTimeout(() => {
                    el.pullScreen.style.display = 'none';
                    startCountdown();
                }, TIMINGS.pullFade);
            } catch (err) {
                console.error('Start error:', err);
                el.pullScreen.style.opacity = '0';
                setTimeout(() => {
                    el.pullScreen.style.display = 'none';
                    startCountdown();
                }, TIMINGS.pullFade);
            }
        }

        // ============================================
        // 9. PIXEL TEXT RENDERING
        // ============================================
        
        /** Render text as pixels */
        function renderText(text) {
            try {
                ctx.text.clearRect(0, 0, W, H);
                if (!text) return;

                const temp = document.createElement('canvas');
                const tCtx = temp.getContext('2d');
                temp.width = W; temp.height = H;
                
                let size = Math.min(W / (text.length * 0.7), H * 0.2);
                size = Math.max(22, Math.min(75, size));
                
                tCtx.fillStyle = '#fff';
                tCtx.font = `700 ${size}px Poppins`;
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText(text, W/2, H/2);
                
                const data = tCtx.getImageData(0, 0, W, H).data;
                const gap = 6, radius = 2.5;

                ctx.text.fillStyle = '#00f2fe';
                ctx.text.shadowColor = '#00f2fe';
                ctx.text.shadowBlur = 10;
                
                for (let y = 0; y < H; y += gap) {
                    for (let x = 0; x < W; x += gap) {
                        if (data[(y * W + x) * 4 + 3] > 128) {
                            ctx.text.beginPath();
                            ctx.text.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.text.fill();
                        }
                    }
                }
                ctx.text.shadowBlur = 0;
            } catch (err) { console.error('Text render error:', err); }
        }

        // ============================================
        // 10. MAIN SEQUENCE
        // ============================================
        
        let seqIndex = 0;

        /** Start main sequence */
        function startMainSequence() {
            try {
                seqIndex = 0;
                el.rightTapBtn.style.display = 'flex';
                createProgressDots();
                playSequence();
            } catch (err) { console.error('Sequence start error:', err); showCard(); }
        }

        /** Create progress dots */
        function createProgressDots() {
            try {
                el.progressDots.innerHTML = '';
                el.progressDots.style.display = 'flex';
                
                slides.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.onclick = () => goToSlide(i);
                    el.progressDots.appendChild(dot);
                });
            } catch (err) { console.error('Dots error:', err); }
        }

        /** Update progress dots */
        function updateDots(index) {
            el.progressDots.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        }

        /** Play sequence */
        function playSequence() {
            try {
                if (seqIndex < mainSequence.length) {
                    renderText(mainSequence[seqIndex]);
                    triggerFireworks();
                    updateDots(seqIndex);
                } else {
                    renderText('');
                    el.rightTapBtn.style.display = 'none';
                    el.progressDots.style.display = 'none';
                    showCard();
                }
            } catch (err) { console.error('Play error:', err); showCard(); }
        }

        /** Next step */
        function nextSequenceStep() { seqIndex++; playSequence(); }

        // ============================================
        // 11. 3D HEART
        // ============================================
        
        let heartCreated = false;

        /** Generate 3D heart */
        function generate3DHeart() {
            try {
                if (heartCreated) return;
                el.heartScene.innerHTML = '';
                
                const total = 70;
                const scale = W < 480 ? 6 : 9;

                for (let i = 0; i < total; i++) {
                    const t = (i / total) * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    
                    const item = document.createElement('div');
                    item.className = 'love-item';
                    item.innerText = 'I love you';
                    item.style.transform = `translate3d(${x * scale}px, ${y * scale}px, 0)`;
                    el.heartScene.appendChild(item);
                }
                heartCreated = true;
            } catch (err) { console.error('3D heart error:', err); }
        }

        // ============================================
        // 12. HEART TREE
        // ============================================
        
        /** Draw heart tree */
        function drawHeartTree() {
            try {
                const c = canvases.tree;
                c.width = c.parentElement.clientWidth;
                c.height = c.parentElement.clientHeight;
                
                ctx.tree.clearRect(0, 0, c.width, c.height);
                ctx.tree.fillStyle = '#d4a373';
                ctx.tree.fillRect(c.width/2 - 6, c.height - 50, 12, 50);

                for (let i = 0; i < 120; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * 45;
                    const x = c.width/2 + Math.cos(angle) * r;
                    const y = c.height - 80 + Math.sin(angle) * r * 0.8;
                    
                    ctx.tree.font = `${8 + Math.random()*8}px serif`;
                    ctx.tree.fillStyle = `hsl(${340 + Math.random()*30}, 90%, ${60 + Math.random()*20}%)`;
                    ctx.tree.fillText('♥', x, y);
                }
            } catch (err) { console.error('Tree error:', err); }
        }

        // ============================================
        // 13. NEON HEART
        // ============================================
        
        let neonAnimId = null;

        /** Draw neon heart */
        function drawNeonHeart() {
            try {
                const c = canvases.neon;
                c.width = el.neonHeartContainer.clientWidth;
                c.height = el.neonHeartContainer.clientHeight;
                
                ctx.neon.clearRect(0, 0, c.width, c.height);
                ctx.neon.save();
                ctx.neon.translate(c.width/2, c.height/2 - 10);

                ctx.neon.beginPath();
                const scale = Math.min(c.width, c.height) / 38;
                
                for (let t = 0; t <= Math.PI * 2; t += 0.02) {
                    const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                    if (t === 0) ctx.neon.moveTo(x, y);
                    else ctx.neon.lineTo(x, y);
                }
                
                ctx.neon.strokeStyle = '#ff2a85';
                ctx.neon.lineWidth = 3;
                ctx.neon.shadowColor = '#00f2fe';
                ctx.neon.shadowBlur = 18;
                ctx.neon.stroke();
                ctx.neon.restore();

                neonAnimId = requestAnimationFrame(drawNeonHeart);
            } catch (err) { console.error('Neon error:', err); }
        }

        // ============================================
        // 14. RELATIONSHIP CLOCK
        // ============================================
        
        /** Start clock */
        function startRelationshipClock() {
            updateClock();
            setInterval(updateClock, 1000);
        }

        /** Update clock */
        function updateClock() {
            try {
                const now = new Date();
                const diff = now - RELATIONSHIP_START_DATE;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24)) + BASE_DAYS;
                el.liveClock.innerText = `Together for ${days} Days ✨`;
            } catch (err) { console.error('Clock error:', err); }
        }

        // ============================================
        // 15. MUSIC PLAYER
        // ============================================
        
        let isMusicPlaying = false;

        /** Play music */
        function playMusic() {
            try {
                el.bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicUI();
                    el.musicPlayer.style.display = 'flex';
                    el.musicInfo.textContent = '🎵 Now Playing...';
                }).catch(() => {
                    isMusicPlaying = false;
                    updateMusicUI();
                    el.musicPlayer.style.display = 'flex';
                    el.musicInfo.textContent = '🎵 Click play ▶';
                });
            } catch (err) {
                console.error('Music play error:', err);
                isMusicPlaying = false;
                updateMusicUI();
            }
        }

        /** Toggle music */
        function toggleMusic() {
            try {
                if (isMusicPlaying) {
                    el.bgMusic.pause();
                    isMusicPlaying = false;
                } else {
                    el.bgMusic.play();
                    isMusicPlaying = true;
                }
                updateMusicUI();
            } catch (err) { console.error('Toggle error:', err); }
        }

        /** Update music UI */
        function updateMusicUI() {
            el.playPauseBtn.textContent = isMusicPlaying ? '⏸' : '▶';
        }

        function showCard() {
            el.mainCard.style.display = 'block';

            updateCard();
            triggerFireworks();

        /** Hide animations */
        function hideAnimations() {
            el.heartContainer.style.display = 'none';
            el.treeContainer.style.display = 'none';
            el.neonHeartContainer.style.display = 'none';
            el.cardImageWrap.style.display = 'none';
            if (neonAnimId) { cancelAnimationFrame(neonAnimId); neonAnimId = null; }
        }

        /** Update card */
        function updateCard() {
            try {
                hideAnimations();
                const slide = slides[currentSlide];
                
                el.cardTitle.innerText = slide.title;
                el.cardDesc.innerText = slide.desc || '';
                el.cardDesc.style.display = slide.desc ? 'block' : 'none';

                if (slide.hasImage && slide.imgSrc) {
                    el.cardImageWrap.style.display = 'block';
                    el.cardImage.src = slide.imgSrc;
                    el.imgCaption.innerText = slide.imgCaption || '💕';
                } else if (slide.has3DHeart) {
                    el.heartContainer.style.display = 'block';
                    generate3DHeart();
                } else if (slide.hasHeartTree) {
                    el.treeContainer.style.display = 'flex';
                    drawHeartTree();
                } else if (slide.hasNeonHeart) {
                    el.neonHeartContainer.style.display = 'block';
                    drawNeonHeart();
                }

                if (slide.isMarryPage) {
                    el.cardTitle.classList.add('marry-me-title');
                    el.actionArea.innerHTML = `<div class="btn-group"><button class="btn-yes" onclick="handleYes(event)">Yes, I Will! 💍💖</button></div>`;
                    setTimeout(() => triggerFireworks(), 300);
                } else {
                    el.cardTitle.classList.remove('marry-me-title');
                    el.actionArea.innerHTML = `<div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>`;
                }
                
                updateDots(currentSlide);
                triggerHearts(W/2, H/2);
            } catch (err) { console.error('Update card error:', err); }
        }

        /** Handle card click */
        function handleCardClick() {
            if (!slides[currentSlide].isMarryPage && currentSlide < slides.length - 1) {
                currentSlide++;
                updateCard();
                triggerFireworks();
            }
        }

        /** Go to slide */
        function goToSlide(index) {
            if (index >= 0 && index < slides.length) {
                currentSlide = index;
                updateCard();
                triggerFireworks();
            }
        }

        // ============================================
        // 17. MARRIAGE RESPONSE
        // ============================================
        
        /** Handle yes */
        function handleYes(e) {
            e.stopPropagation();
            hideAnimations();
            
            el.cardTitle.innerText = '🎉 FOREVER & ALWAYS 🎉';
            el.cardDesc.innerText = 'I Love You So Much ᴀʏᴇꜱʜᴀ! ❤️ আপনার সাথে সারা জীবন কাটানোর জন্য অপেক্ষায় রইলাম।';
            el.cardDesc.style.display = 'block';
            el.cardTitle.classList.add('marry-me-title');
            
            triggerGrandCelebration();

            el.actionArea.innerHTML = `
                <div class="btn-group">
                    <button class="btn-action" onclick="replay(event)">REPLAY 🔄</button>
                    <button class="btn-action btn-home" onclick="goHome(event)">HOME 🏠</button>
                </div>
            `;
        }

        /** Replay */
        function replay(e) {
            e.stopPropagation();
            currentSlide = 0;
            updateCard();
            triggerFireworks();
        }

        /** Go home */
        function goHome(e) {
            e.stopPropagation();
            hideAnimations();
            
            el.mainCard.style.display = 'none';
            el.pullScreen.style.display = 'flex';
            el.pullScreen.style.opacity = '1';
            el.cordLine.style.height = '240px';
            
            el.welRow1.classList.remove('show');
            el.welRow2.classList.remove('show');
            
            cordState.started = false;
            cordState.drag = 0;
            seqIndex = 0;
            currentSlide = 0;
            heartParticles = [];
            fwParticles = [];
            heartCreated = false;
            
            initMatrixColumns();
            ctx.text.clearRect(0, 0, W, H);
            ctx.fireworks.clearRect(0, 0, W, H);
            ctx.hearts.clearRect(0, 0, W, H);
            
            el.rightTapBtn.style.display = 'none';
            el.progressDots.style.display = 'none';
            
            el.bgMusic.pause();
            el.bgMusic.currentTime = 0;
            isMusicPlaying = false;
            updateMusicUI();
            el.musicPlayer.style.display = 'none';
        }

        // ============================================
        // 18. APP STARTUP
        // ============================================
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        console.log(`
╔════════════════════════════════════════╗
║   💖 Ayesha + Sadik Love Story 💖     ║
║   Optimized & Enhanced Version        ║
║   Made with ❤️ for AHUBATI            ║
╚════════════════════════════════════════╝
        `);
    </script>
</body>
</html>
