<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayesha + Sadik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000 !important;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pull Screen with Pitch Black BG */
        #pull-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65); /* Matrix rain visible behind */
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: none;
            transition: opacity 1s ease;
        }

        .cord-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cord-line {
            width: 4px;
            height: 280px;
            background: linear-gradient(to bottom, #ffd700, #00f2fe, #ff2a85);
            box-shadow: 0 0 15px #00f2fe, 0 0 25px #ffd700;
            transition: height 0.1s ease;
        }

        .cord-handle {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #ffffff, #00f2fe);
            border-radius: 50%;
            box-shadow: 0 0 25px #00f2fe, 0 0 35px #ffffff;
            border: 2px solid #ffd700;
        }

        .pull-hint {
            color: #ffd700;
            margin-top: 45px;
            font-family: 'Cinzel', serif;
            font-size: 19px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: pulseGlow 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.04); }
        }

        /* Welcome Screen with Pitch Black BG */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
        }

        .welcome-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .welcome-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-title {
            font-size: 42px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #00f2fe, 0 0 40px #ff2a85;
            line-height: 1.4;
            font-weight: bold;
        }

        .welcome-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: #ffd700;
            margin-top: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #matrixCanvas { z-index: 10; background-color: #000000; }
        #textCanvas { z-index: 20; pointer-events: none; }
        #fireworksCanvas { z-index: 30; pointer-events: none; }

        /* Floating Tap Button */
        .right-tap-btn {
            position: fixed;
            right: 25px;
            bottom: 35%;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #00f2fe, #007799);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.9);
            cursor: pointer;
            z-index: 500;
            display: none;
            animation: floatBtn 2s infinite alternate ease-in-out;
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        /* Card Container */
        .card-container {
            position: relative;
            z-index: 600;
            background: rgba(4, 8, 16, 0.95);
            border: 2px solid #00f2fe;
            outline: 2px solid #ffd700;
            outline-offset: -7px;
            border-radius: 16px;
            padding: 40px 30px;
            width: 88%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.5), inset 0 0 30px rgba(255, 42, 133, 0.2);
            backdrop-filter: blur(15px);
            display: none;
            cursor: pointer;
            animation: popup 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .corner-ornament {
            position: absolute;
            width: 32px;
            height: 32px;
            fill: #ffd700;
        }
        .top-left { top: 6px; left: 6px; }
        .top-right { top: 6px; right: 6px; transform: scaleX(-1); }
        .bottom-left { bottom: 6px; left: 6px; transform: scaleY(-1); }
        .bottom-right { bottom: 6px; right: 6px; transform: scale(-1); }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #00f2fe;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.7);
        }

        .marry-me-title {
            font-family: 'Playfair Display', serif !important;
            font-style: italic;
            font-size: 32px !important;
            color: #ffd700 !important;
            text-shadow: 0 0 20px #ffd700, 0 0 30px #ff2a85 !important;
        }

        .card-desc {
            font-size: 16px;
            color: #e0f7fa;
            line-height: 1.8;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .tap-card-hint {
            font-size: 13px;
            color: #ffd700;
            margin-top: 15px;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-yes {
            background: linear-gradient(45deg, #00f2fe, #ffd700);
            color: #000;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            transition: transform 0.2s;
        }

        .btn-yes:active { transform: scale(0.95); }

        .btn-action {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .btn-exit {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Pull Screen -->
    <div id="pull-screen">
        <div class="cord-wrapper" id="cordWrapper">
            <div class="cord-line" id="cordLine"></div>
            <div class="cord-handle"></div>
        </div>
        <div class="pull-hint">PULL DOWN TO BEGIN ✨</div>
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-content" id="welRow1">
            <div class="welcome-title">Hey 𝔸𝕪𝕖𝕤𝕙𝕒, My Love</div>
        </div>
        <div class="welcome-content" id="welRow2">
            <div class="welcome-subtitle">WELCOME 𝔸𝕪𝕖𝕤𝕙𝕒, THIS IS FOR YOU ✨</div>
        </div>
    </div>

    <!-- Canvases -->
    <canvas id="matrixCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <!-- Tap Button -->
    <div id="rightTapBtn" class="right-tap-btn" onclick="nextSequenceStep()">TAP</div>

    <!-- Card Container -->
    <div id="mainCard" class="card-container" onclick="handleCardClick()">
        <svg class="corner-ornament top-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament top-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-left" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>
        <svg class="corner-ornament bottom-right" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 L30,30 L30,90 L10,90 Z"/></svg>

        <h2 id="cardTitle" class="card-title"></h2>
        <p id="cardDesc" class="card-desc"></p>

        <div id="actionArea">
            <div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const textCanvas = document.getElementById('textCanvas');
        const tCtx = textCanvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');

        const pullScreen = document.getElementById('pull-screen');
        const cordWrapper = document.getElementById('cordWrapper');
        const cordLine = document.getElementById('cordLine');
        const welcomeScreen = document.getElementById('welcome-screen');
        const welRow1 = document.getElementById('welRow1');
        const welRow2 = document.getElementById('welRow2');
        const bgMusic = document.getElementById('bgMusic');
        const rightTapBtn = document.getElementById('rightTapBtn');

        function resize() {
            matrixCanvas.width = textCanvas.width = fwCanvas.width = window.innerWidth;
            matrixCanvas.height = textCanvas.height = fwCanvas.height = window.innerHeight;
            initMatrixColumns();
        }

        // Exact Request Words for Rain
        const rainPhrases = [
            "100 WEEKS ",
            "700 DAYS ",
            "AYESHA ",
            "AHUBATI ",
            "I LOVE YOU ",
            "SADIK "
        ];

        let fontSize = 16; // Smaller font for denser columns
        let columns = 0;
        let drops = [];

        function initMatrixColumns() {
            columns = Math.floor(window.innerWidth / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                const phrase = rainPhrases[i % rainPhrases.length];
                drops[i] = {
                    y: Math.random() * -60,
                    speed: 0.25 + Math.random() * 0.25, // SLOW Speed
                    phrase: phrase,
                    charIndex: Math.floor(Math.random() * phrase.length)
                };
            }
        }

        resize();
        window.addEventListener('resize', resize);

        // Start Rain IMMEDIATELY on load
        let matrixInterval = setInterval(drawMatrixBG, 40);

        function drawMatrixBG() {
            // Strictly Solid Pure Black Refresh (#000000)
            mCtx.fillStyle = '#000000';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            mCtx.font = 'bold 15px monospace';

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                
                // Draw trailing letters for dense rain look
                const trailLength = 8;
                for (let j = 0; j < trailLength; j++) {
                    const charY = (drop.y - j) * fontSize;
                    if (charY < 0 || charY > matrixCanvas.height) continue;

                    const idx = (drop.charIndex - j + drop.phrase.length * 100) % drop.phrase.length;
                    const char = drop.phrase[idx];

                    if (j === 0) {
                        // Head character: Bright White Glow
                        mCtx.fillStyle = '#ffffff';
                        mCtx.shadowColor = '#00f2fe';
                        mCtx.shadowBlur = 8;
                    } else {
                        // Body character: Pink
                        const alpha = 1 - (j / trailLength);
                        mCtx.fillStyle = `rgba(255, 42, 133, ${alpha})`;
                        mCtx.shadowBlur = 0;
                    }

                    const x = i * fontSize;
                    mCtx.fillText(char, x, charY);
                }

                drop.y += drop.speed; // Slow movement
                drop.charIndex++;

                if (drop.y * fontSize > matrixCanvas.height + 150) {
                    drop.y = Math.random() * -20;
                    drop.speed = 0.25 + Math.random() * 0.25;
                }
            }
        }

        // Pull Mechanism
        let startY = 0, currentDrag = 0;
        const maxDrag = 170;

        cordWrapper.addEventListener('touchstart', (e) => startY = e.touches[0].clientY);
        cordWrapper.addEventListener('touchmove', (e) => {
            let y = e.touches[0].clientY;
            currentDrag = Math.max(0, Math.min(maxDrag, y - startY));
            cordLine.style.height = (280 + currentDrag) + 'px';
            if (currentDrag >= maxDrag) triggerSystemStart();
        });
        cordWrapper.addEventListener('touchend', () => { if (currentDrag < maxDrag) cordLine.style.height = '280px'; });
        cordWrapper.addEventListener('click', () => triggerSystemStart());

        function triggerSystemStart() {
            bgMusic.play().catch(()=>{});
            pullScreen.style.opacity = '0';

            setTimeout(() => {
                pullScreen.style.display = 'none';
                welcomeScreen.style.display = 'flex';
                triggerBurstFireworks();

                setTimeout(() => { welRow1.classList.add('show'); triggerBurstFireworks(); }, 400);
                setTimeout(() => { welRow2.classList.add('show'); triggerBurstFireworks(); }, 2000);

                setTimeout(() => {
                    welcomeScreen.style.opacity = '0';
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        startCountdownSequence();
                    }, 1500);
                }, 5200);
            }, 800);
        }

        // Burst Fireworks
        let particles = [];
        function triggerBurstFireworks() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight * 0.4;
            const colors = ['#ffd700', '#00f2fe', '#ff2a85', '#ffffff'];

            for (let i = 0; i < 45; i++) {
                const angle = (Math.PI * 2 / 45) * i;
                const speed = Math.random() * 5 + 2;
                particles.push({ 
                    x: centerX, y: centerY, 
                    vx: Math.cos(angle) * speed, 
                    vy: Math.sin(angle) * speed, 
                    alpha: 1, 
                    color: colors[Math.floor(Math.random() * colors.length)] 
                });
            }
            animateFireworks();
        }

        function animateFireworks() {
            if (particles.length === 0) return;
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color; fwCtx.globalAlpha = p.alpha; fwCtx.fill();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
            fwCtx.globalAlpha = 1;
            if (particles.length > 0) requestAnimationFrame(animateFireworks);
        }

        // Sky Blue / Cyan Color for Main Center Dot Text
        function renderTextPixel(text) {
            tCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            if (!text) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = textCanvas.width;
            tempCanvas.height = textCanvas.height;

            let dynamicFontSize = Math.min(textCanvas.width / (text.length * 0.65), textCanvas.height * 0.22);
            if (dynamicFontSize > 85) dynamicFontSize = 85;

            tempCtx.fillStyle = '#fff';
            tempCtx.font = `900 ${dynamicFontSize}px sans-serif`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(text, tempCanvas.width / 2, tempCanvas.height / 2);

            const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imgData.data;

            const dotGap = 6;
            const dotRadius = 2.5;

            // Sky Blue Color Glow (#00f2fe)
            tCtx.fillStyle = '#00f2fe';
            tCtx.shadowColor = '#00f2fe';
            tCtx.shadowBlur = 14;

            for (let y = 0; y < tempCanvas.height; y += dotGap) {
                for (let x = 0; x < tempCanvas.width; x += dotGap) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (data[index + 3] > 128) {
                        tCtx.beginPath();
                        tCtx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        tCtx.fill();
                    }
                }
            }
        }

        const mainSequence = [
            "100 WEEKS",
            "700 DAYS",
            "AYESHA + SADIK",
            "AHUBATI + AHUBI",
            "I LOVE YOU"
        ];

        let seqIndex = 0;

        function startCountdownSequence() {
            rightTapBtn.style.display = 'none';
            
            renderTextPixel("3");
            triggerBurstFireworks();

            setTimeout(() => {
                renderTextPixel("2");
                triggerBurstFireworks();
                setTimeout(() => {
                    renderTextPixel("1");
                    triggerBurstFireworks();
                    setTimeout(() => {
                        seqIndex = 0;
                        rightTapBtn.style.display = 'flex';
                        playNextMainSequence();
                    }, 850);
                }, 850);
            }, 850);
        }

        function playNextMainSequence() {
            if (seqIndex < mainSequence.length) {
                renderTextPixel(mainSequence[seqIndex]);
                triggerBurstFireworks();
            } else {
                renderTextPixel("");
                rightTapBtn.style.display = 'none';
                showCard();
            }
        }

        function nextSequenceStep() {
            seqIndex++;
            playNextMainSequence();
        }

        // Card Dialogues
        let currentSlide = 0;
        const slides = [
            { 
                title: "✨ 100 Weeks & 700 Days ✨", 
                desc: "আয়েশা (AHUBATI), ১০০ টি সপ্তাহ এবং ৭০০ টি দিন ধরে আমার পাশে থাকার জন্য অনেক ধন্যবাদ।" 
            },
            { 
                title: "💖 For My Special One 💖", 
                desc: "You are my JAPAN without P! 🥰 (You are my JAAN ❤️)" 
            },
            { 
                title: "🌸 Pure Happiness 🌸", 
                desc: "জীবনের প্রতিটি মুহূর্ত তোমার ভালোবাসা দিয়ে সুন্দর করার জন্য আমি চিরকৃতজ্ঞ।" 
            },
            { 
                title: "💍 Will You Marry Me? 💍", 
                desc: "আমার জীবনের বাকিটা সময় কি এভাবেই নিজের করে নিবে? Will you marry me, my love? ❤️",
                isMarryPage: true
            }
        ];

        const cardEl = document.getElementById('mainCard');
        const titleEl = document.getElementById('cardTitle');
        const descEl = document.getElementById('cardDesc');
        const actionArea = document.getElementById('actionArea');

        function showCard() {
            cardEl.style.display = 'block';
            currentSlide = 0;
            updateCard();
        }

        function updateCard() {
            titleEl.innerText = slides[currentSlide].title;
            descEl.innerText = slides[currentSlide].desc;
            triggerBurstFireworks();

            if (slides[currentSlide].isMarryPage) {
                titleEl.classList.add('marry-me-title');
                actionArea.innerHTML = `
                    <div class="btn-group">
                        <button class="btn-yes" onclick="handleYesClick(event)">Yes, I Will! 💍💖</button>
                    </div>
                `;
            } else {
                titleEl.classList.remove('marry-me-title');
                actionArea.innerHTML = `<div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>`;
            }
        }

        function handleCardClick() {
            if (!slides[currentSlide].isMarryPage) {
                currentSlide++;
                updateCard();
            }
        }

        function handleYesClick(e) {
            e.stopPropagation();
            titleEl.innerText = "🎉 FOREVER & ALWAYS 🎉";
            descEl.innerText = "I Love You So Much 𝔸𝕪𝕖𝕤𝕙𝕒! ❤️ আপনার সাথে সারা জীবন কাটানোর জন্য অপেক্ষায় রইলাম।";
            triggerBurstFireworks();

            actionArea.innerHTML = `
                <div class="btn-group">
                    <button class="btn-action" onclick="replayProject(event)">REPLAY 🔄</button>
                    <button class="btn-action btn-exit" onclick="exitProject(event)">EXIT ❌</button>
                </div>
            `;
        }

        function replayProject(e) {
            e.stopPropagation();
            cardEl.style.display = 'none';
            pullScreen.style.display = 'flex';
            pullScreen.style.opacity = '1';
            cordLine.style.height = '280px';
            welRow1.classList.remove('show');
            welRow2.classList.remove('show');
        }

        function exitProject(e) {
            e.stopPropagation();
            alert("Thank you for being in my life! ❤️");
            window.close();
        }
    </script>
</body>
</html>
