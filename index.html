<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ayesha + Sadik ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            color: #ffffff;
        }

        /* ---------- PULL CORD WITH MULTI-COLOR LINE & CYAN GLOWING BALL ---------- */
        #pull-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 8, 0.96);
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: none;
            transition: opacity 1s ease;
        }

        .cord-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .cord-line {
            width: 6px;
            height: 240px;
            background: linear-gradient(to bottom, #00f2fe, #ffd700, #ff2a85, #00f2fe);
            box-shadow: 0 0 15px #00f2fe, 0 0 25px #ff2a85;
            transition: height 0.08s ease;
            border-radius: 3px;
        }

        .cord-handle {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle, #ffffff 10%, #00f2fe 70%, #0080ff 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px #00f2fe, 0 0 45px #00f2fe, 0 0 65px rgba(0, 242, 254, 0.9);
            border: 2px solid #ffffff;
        }

        .pull-hint {
            color: #00f2fe;
            margin-top: 35px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 12px #00f2fe;
            animation: pulseCyan 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulseCyan {
            0% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.04); }
        }

        /* ---------- WELCOME SCREEN ---------- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #050508;
            z-index: 8000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 1.2s ease-in-out;
            text-align: center;
        }

        .welcome-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .welcome-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-title {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px #00f2fe, 0 0 30px #ff2a85;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #00f2fe;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #00f2fe;
        }

        /* ---------- CANVASES ---------- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #matrixCanvas { z-index: 10; background: #050508; }
        #textCanvas { z-index: 20; pointer-events: none; }
        #fireworksCanvas { z-index: 30; pointer-events: none; }
        #heartsCanvas { z-index: 15; pointer-events: none; }

        /* ---------- TAP BUTTON ---------- */
        .right-tap-btn {
            position: fixed;
            right: 20px;
            bottom: 35%;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #00f2fe, #0080ff);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            cursor: pointer;
            z-index: 500;
            animation: floatBtn 2s infinite alternate ease-in-out;
            text-align: center;
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        /* ---------- CARD CONTAINER ---------- */
        .card-container {
            position: relative;
            z-index: 600;
            background: rgba(15, 15, 25, 0.94);
            border: 2px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 25px 20px;
            width: 92%;
            max-width: 480px;
            text-align: center;
            backdrop-filter: blur(14px);
            display: none;
            cursor: pointer;
            animation: popup 0.6s ease forwards;
        }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe;
            margin-bottom: 12px;
        }

        .marry-me-title {
            font-size: 28px !important;
            color: #ffd700 !important;
            text-shadow: 0 0 20px #ff2a85 !important;
        }

        .card-desc {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 400;
        }

        /* Image Box */
        .card-image-wrap {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            position: relative;
            background: #111;
        }

        .card-image-wrap img {
            width: 100%;
            height: auto;
            max-height: 240px;
            object-fit: cover;
            display: block;
        }

        .img-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 12px 10px 8px;
            color: #fff;
            font-size: 13.5px;
        }

        /* 3D Heart Rotational Animation */
        #heartContainer {
            width: 100%;
            height: 220px;
            position: relative;
            display: none;
            perspective: 800px;
            margin: 10px 0;
        }

        .heart-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateHeart 14s infinite linear;
        }

        @keyframes rotateHeart {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        .love-item {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #ff2a85;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 0 0 8px #ff2a85, 0 0 15px #ffd700;
            transform-origin: center center;
        }

        /* Heart Tree Widget */
        #treeContainer {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .tree-layout {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
        }

        .tree-text-box {
            width: 50%;
            text-align: left;
            font-size: 11px;
            line-height: 1.5;
            color: #ffd700;
        }

        .tree-canvas-box {
            width: 50%;
            height: 180px;
            position: relative;
        }

        #treeCanvas {
            width: 100%;
            height: 100%;
        }

        .clock-box {
            margin-top: 10px;
            font-size: 12px;
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        /* Neon Particle Heart */
        #neonHeartContainer {
            width: 100%;
            height: 220px;
            display: none;
            position: relative;
            margin: 10px 0;
        }

        #neonCanvas {
            width: 100%;
            height: 100%;
        }

        .tap-card-hint {
            font-size: 13px;
            color: #00f2fe;
            margin-top: 12px;
            letter-spacing: 1px;
            animation: pulseCyan 1.5s infinite alternate;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff2a85, #ffd700);
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.8);
        }

        .btn-action {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
        }
        .btn-home { background: linear-gradient(45deg, #ffd700, #ff8800); color: #000; }

        @media (max-width: 480px) {
            .welcome-title { font-size: 26px; }
            .card-title { font-size: 19px; }
            .marry-me-title { font-size: 24px !important; }
            .card-desc { font-size: 13.5px; }
            .right-tap-btn { width: 55px; height: 55px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- ===== PULL SCREEN ===== -->
    <div id="pull-screen">
        <div class="cord-wrapper" id="cordWrapper">
            <div class="cord-line" id="cordLine"></div>
            <div class="cord-handle"></div>
        </div>
        <div class="pull-hint">⬇ PULL DOWN TO BEGIN ✨</div>
    </div>

    <!-- ===== WELCOME SCREEN ===== -->
    <div id="welcome-screen">
        <div class="welcome-content" id="welRow1">
            <div class="welcome-title">Hey ᴀʏᴇꜱʜᴀ, My Love ❤️</div>
        </div>
        <div class="welcome-content" id="welRow2">
            <div class="welcome-subtitle">✨ WELCOME, THIS IS FOR YOU ✨</div>
        </div>
    </div>

    <!-- ===== CANVASES ===== -->
    <canvas id="matrixCanvas"></canvas>
    <canvas id="heartsCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <!-- ===== TAP BUTTON ===== -->
    <div id="rightTapBtn" class="right-tap-btn" onclick="nextSequenceStep()">TAP<br/>❤️</div>

    <!-- ===== MAIN CARD ===== -->
    <div id="mainCard" class="card-container" onclick="handleCardClick()">
        <h2 id="cardTitle" class="card-title"></h2>

        <div id="cardImageWrap" class="card-image-wrap" style="display:none;">
            <img id="cardImage" src="" alt="Ayesha & Sadik" />
            <div class="img-caption" id="imgCaption">💕</div>
        </div>

        <div id="heartContainer">
            <div class="heart-scene" id="heartScene"></div>
        </div>

        <div id="treeContainer">
            <div class="tree-layout">
                <div class="tree-text-box">
                    Hey ᴀʏᴇꜱʜᴀ 💕<br/>
                    Happy Moments ✨<br/>
                    May God bless you 🤲<br/>
                    Always stay happy 💕<br/>
                    Sending love & vibes 💖<br/>
                    ᴀʏᴇꜱʜᴀ + ꜱᴀᴅɪᴋ Forever ❤️
                </div>
                <div class="tree-canvas-box">
                    <canvas id="treeCanvas"></canvas>
                </div>
            </div>
            <div class="clock-box" id="liveClock">Together for 700 Days ✨</div>
        </div>

        <div id="neonHeartContainer">
            <canvas id="neonCanvas"></canvas>
        </div>

        <p id="cardDesc" class="card-desc"></p>

        <div id="actionArea">
            <div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>
        </div>
    </div>

    <!-- ===== AUDIO ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg" />
    </audio>

    <script>
        // ============================================================
        // 1. ছবির লিংকসমূহ
        // ============================================================
        const IMAGE_1 = 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&h=600&fit=crop';
        const IMAGE_2 = 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=800&h=600&fit=crop';
        const IMAGE_3 = 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800&h=600&fit=crop';
        const IMAGE_4 = 'https://images.unsplash.com/photo-1519741497674-611481863552?w=800&h=600&fit=crop';

        // ============================================================
        // 2. স্লাইড তালিকা (Stylized Font সহ)
        // ============================================================
        const slides = [
            {
                title: '✨ 100 Weeks & 700 Days ✨',
                desc: 'আয়েশা (AHUBATI), ১০০ টি সপ্তাহ এবং ৭০০ টি দিন ধরে আমার পাশে থাকার জন্য অনেক ধন্যবাদ।',
                hasImage: false
            },
            {
                title: '💖 For My Special One 💖',
                desc: 'You are my JAPAN without P! 🥰 (You are my JAAN ❤️)',
                hasImage: false
            },
            {
                title: '🌸 Memory 01 🌸',
                desc: 'তোমার সাথে কাটানো প্রতিটি মুহূর্ত আমার কাছে দারুণ স্পেশাল। 💕',
                hasImage: true,
                imgSrc: IMAGE_1,
                imgCaption: '💕 তোমার সাথে কাটানো মুহূর্ত 💕'
            },
            {
                title: '🌅 Memory 02 🌅',
                desc: 'জীবনের প্রতিটি পদক্ষেপে তোমাকে পাশে চাই।',
                hasImage: true,
                imgSrc: IMAGE_2,
                imgCaption: '🌹 চিরকাল তোমার সাথে 🌹'
            },
            {
                title: '💫 Memory 03 💫',
                desc: 'তুমি আমার জীবনের সবচেয়ে সুন্দর উপহার। ✨',
                hasImage: true,
                imgSrc: IMAGE_3,
                imgCaption: '🌟 তুমি আমার সব 🌟'
            },
            {
                title: '🌹 Memory 04 🌹',
                desc: 'এই পৃথিবীতে তুমিই আমার একমাত্র প্রিয় মানুষ। ❤️',
                hasImage: true,
                imgSrc: IMAGE_4,
                imgCaption: '💍 শুধু তুমিই 💍'
            },
            {
                title: 'I Love You ᴀʏᴇꜱʜᴀ ❤️',
                has3DHeart: true
            },
            {
                title: 'ᴀʏᴇꜱʜᴀ + ꜱᴀᴅɪᴋ Tree 🌸',
                hasHeartTree: true
            },
            {
                title: 'Neon Glow Heart ✨',
                hasNeonHeart: true
            },
            {
                title: '💍 Will You Marry Me? 💍',
                desc: 'আমার জীবনের বাকিটা সময় কি এভাবেই নিজের করে নিবে? Will you marry me, my love? ❤️',
                hasImage: false,
                isMarryPage: true
            }
        ];

        // ============================================================
        // 3. CANVAS & SYSTEM SETUP
        // ============================================================
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const textCanvas = document.getElementById('textCanvas');
        const tCtx = textCanvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        const heartsCanvas = document.getElementById('heartsCanvas');
        const hCtx = heartsCanvas.getContext('2d');

        const pullScreen = document.getElementById('pull-screen');
        const cordWrapper = document.getElementById('cordWrapper');
        const cordLine = document.getElementById('cordLine');
        const welcomeScreen = document.getElementById('welcome-screen');
        const welRow1 = document.getElementById('welRow1');
        const welRow2 = document.getElementById('welRow2');
        const bgMusic = document.getElementById('bgMusic');
        const rightTapBtn = document.getElementById('rightTapBtn');

        let W, H;

        function resizeAll() {
            W = window.innerWidth;
            H = window.innerHeight;
            matrixCanvas.width = textCanvas.width = fwCanvas.width = heartsCanvas.width = W;
            matrixCanvas.height = textCanvas.height = fwCanvas.height = heartsCanvas.height = H;
            initMatrixColumns();
        }
        window.addEventListener('resize', resizeAll);

        // ============================================================
        // 4. MATRIX RAIN
        // ============================================================
        const rainPhrases = ["100 WEEKS ", "700 DAYS ", "ᴀʏᴇꜱʜᴀ ", "AHUBATI ", "I LOVE YOU ", "ꜱᴀᴅɪᴋ "];
        let fontSize = 15, columns = 0, drops = [];

        function initMatrixColumns() {
            columns = Math.floor(W / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                const phrase = rainPhrases[i % rainPhrases.length];
                drops[i] = {
                    y: Math.random() * -60,
                    speed: 0.20 + Math.random() * 0.25,
                    phrase: phrase,
                    charIndex: Math.floor(Math.random() * phrase.length)
                };
            }
        }
        resizeAll();

        function drawMatrixBG() {
            mCtx.fillStyle = '#050508';
            mCtx.fillRect(0, 0, W, H);
            mCtx.font = 'bold 14px monospace';

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                const trailLen = 8;
                for (let j = 0; j < trailLen; j++) {
                    const charY = (drop.y - j) * fontSize;
                    if (charY < 0 || charY > H) continue;
                    const idx = (drop.charIndex - j + drop.phrase.length * 100) % drop.phrase.length;
                    const char = drop.phrase[idx];
                    if (j === 0) {
                        mCtx.fillStyle = '#ffffff';
                        mCtx.shadowColor = '#00f2fe';
                        mCtx.shadowBlur = 8;
                    } else {
                        const alpha = 1 - (j / trailLen);
                        mCtx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
                        mCtx.shadowBlur = 0;
                    }
                    mCtx.fillText(char, i * fontSize, charY);
                }
                drop.y += drop.speed;
                drop.charIndex++;
                if (drop.y * fontSize > H + 150) {
                    drop.y = Math.random() * -20;
                    drop.speed = 0.20 + Math.random() * 0.25;
                }
            }
        }
        setInterval(drawMatrixBG, 40);

        // ============================================================
        // 5. FIREWORKS & HEART BURSTS
        // ============================================================
        let heartParticles = [], particles = [];

        function spawnHeartBurst(cx, cy, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                heartParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.2,
                    size: 12 + Math.random() * 18,
                    alpha: 0.9, life: 1,
                    decay: 0.005 + Math.random() * 0.008,
                    color: `hsl(${180 + Math.random() * 160}, 90%, 60%)`
                });
            }
        }

        function drawHeartsCanvas() {
            hCtx.clearRect(0, 0, W, H);
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const p = heartParticles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.04;
                p.life -= p.decay; p.alpha = p.life * 0.9;
                if (p.life <= 0) { heartParticles.splice(i, 1); continue; }
                hCtx.globalAlpha = p.alpha;
                hCtx.font = `${p.size}px serif`;
                hCtx.textAlign = 'center';
                hCtx.fillStyle = p.color || '#00f2fe';
                hCtx.fillText('♥', p.x, p.y);
            }
            hCtx.globalAlpha = 1;
            if (heartParticles.length > 0) requestAnimationFrame(drawHeartsCanvas);
        }

        function triggerHeartBurst(x, y) {
            spawnHeartBurst(x || W / 2, y || H / 2, 30);
            if (heartParticles.length > 0) drawHeartsCanvas();
        }

        function triggerBurstFireworks(cx, cy) {
            const centerX = cx || W / 2, centerY = cy || H * 0.4;
            const colors = ['#00f2fe', '#ffd700', '#ff2a85', '#ffffff', '#00ff88'];
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 / 50) * i;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: centerX, y: centerY,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    alpha: 1, color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2.5 + Math.random() * 3.5
                });
            }
            animateFireworks();
        }

        function triggerGrandCelebration() {
            const corners = [
                {x: W * 0.15, y: H * 0.2},
                {x: W * 0.85, y: H * 0.2},
                {x: W * 0.15, y: H * 0.7},
                {x: W * 0.85, y: H * 0.7},
                {x: W * 0.5, y: H * 0.3}
            ];
            corners.forEach((c, idx) => {
                setTimeout(() => {
                    triggerBurstFireworks(c.x, c.y);
                    triggerHeartBurst(c.x, c.y);
                }, idx * 180);
            });
        }

        function animateFireworks() {
            if (particles.length === 0) return;
            fwCtx.clearRect(0, 0, W, H);
            particles.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.alpha -= 0.018;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color;
                fwCtx.globalAlpha = p.alpha;
                fwCtx.fill();
                if (p.alpha <= 0) particles.splice(idx, 1);
            });
            fwCtx.globalAlpha = 1;
            if (particles.length > 0) requestAnimationFrame(animateFireworks);
        }

        // ============================================================
        // 6. CYAN CORD PULL & FLOW LOGIC
        // ============================================================
        let startY = 0, currentDrag = 0, maxDrag = 150, isStarted = false;

        cordWrapper.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
        cordWrapper.addEventListener('touchmove', (e) => {
            const y = e.touches[0].clientY;
            currentDrag = Math.max(0, Math.min(maxDrag, y - startY));
            cordLine.style.height = (240 + currentDrag) + 'px';
            if (currentDrag >= maxDrag) triggerSystemStart();
        });
        cordWrapper.addEventListener('touchend', () => { if (currentDrag < maxDrag) cordLine.style.height = '240px'; });
        cordWrapper.addEventListener('click', () => triggerSystemStart());

        // ১. পুল কর্ড টানার পর শুরুতেই কাউন্টডাউন (3..2..1)
        function triggerSystemStart() {
            if (isStarted) return;
            isStarted = true;
            bgMusic.play().catch(() => {});
            pullScreen.style.opacity = '0';
            setTimeout(() => {
                pullScreen.style.display = 'none';
                startInitialCountdown();
            }, 800);
        }

        // ২. ৩..২..১ কাউন্টডাউন ফাংশন
        function startInitialCountdown() {
            renderTextPixel('3'); triggerBurstFireworks();
            setTimeout(() => {
                renderTextPixel('2'); triggerBurstFireworks();
                setTimeout(() => {
                    renderTextPixel('1'); triggerBurstFireworks();
                    setTimeout(() => {
                        renderTextPixel('');
                        showWelcomeScreen();
                    }, 800);
                }, 800);
            }, 800);
        }

        // ৩. কাউন্টডাউন শেষে Welcome স্ক্রিন প্রর্দশন
        function showWelcomeScreen() {
            welcomeScreen.style.display = 'flex';
            welcomeScreen.style.opacity = '1';
            triggerBurstFireworks();
            triggerHeartBurst(W / 2, H * 0.5);

            setTimeout(() => { welRow1.classList.add('show'); triggerBurstFireworks(); }, 400);
            setTimeout(() => { welRow2.classList.add('show'); triggerBurstFireworks(); }, 1600);

            setTimeout(() => {
                welcomeScreen.style.opacity = '0';
                setTimeout(() => {
                    welcomeScreen.style.display = 'none';
                    startMainSequence();
                }, 1200);
            }, 4200);
        }

        // ============================================================
        // 7. CYAN GLOWING TEXT PIXEL RENDERING
        // ============================================================
        function renderTextPixel(text) {
            tCtx.clearRect(0, 0, W, H);
            if (!text) return;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = W; tempCanvas.height = H;
            let dynSize = Math.min(W / (text.length * 0.7), H * 0.2);
            if (dynSize > 75) dynSize = 75;
            if (dynSize < 22) dynSize = 22;
            tempCtx.fillStyle = '#fff';
            tempCtx.font = `700 ${dynSize}px Poppins, sans-serif`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(text, W / 2, H / 2);
            const imgData = tempCtx.getImageData(0, 0, W, H).data;
            const dotGap = 6, dotRadius = 2.5;

            tCtx.fillStyle = '#00f2fe';
            tCtx.shadowColor = '#00f2fe';
            tCtx.shadowBlur = 10;
            for (let y = 0; y < H; y += dotGap) {
                for (let x = 0; x < W; x += dotGap) {
                    if (imgData[(y * W + x) * 4 + 3] > 128) {
                        tCtx.beginPath();
                        tCtx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        tCtx.fill();
                    }
                }
            }
            tCtx.shadowBlur = 0;
        }

        const mainSequence = ["100 WEEKS", "700 DAYS", "ᴀʏᴇꜱʜᴀ + ꜱᴀᴅɪᴋ", "AHUBATI + AHUBI", "I LOVE YOU"];
        let seqIndex = 0;

        function startMainSequence() {
            seqIndex = 0;
            rightTapBtn.style.display = 'flex';
            playNextMainSequence();
        }

        function playNextMainSequence() {
            if (seqIndex < mainSequence.length) {
                renderTextPixel(mainSequence[seqIndex]);
                triggerBurstFireworks();
            } else {
                renderTextPixel('');
                rightTapBtn.style.display = 'none';
                showCard();
            }
        }

        function nextSequenceStep() { seqIndex++; playNextMainSequence(); }

        // ============================================================
        // 8. ANIMATION 1: 3D PARAMETRIC HEART
        // ============================================================
        const heartContainer = document.getElementById('heartContainer');
        const heartScene = document.getElementById('heartScene');
        let heartCreated = false;

        function generate3DHeart() {
            if (heartCreated) return;
            heartScene.innerHTML = '';
            const totalItems = 70;
            const isMobile = window.innerWidth < 480;
            const scale = isMobile ? 6 : 9;

            for (let i = 0; i < totalItems; i++) {
                const t = (i / totalItems) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const item = document.createElement('div');
                item.className = 'love-item';
                item.innerText = 'I love you';
                item.style.transform = `translate3d(${x * scale}px, ${y * scale}px, 0px)`;
                heartScene.appendChild(item);
            }
            heartCreated = true;
        }

        // ============================================================
        // 9. ANIMATION 2: HEART TREE
        // ============================================================
        const treeContainer = document.getElementById('treeContainer');
        const treeCanvas = document.getElementById('treeCanvas');
        const treeCtx = treeCanvas.getContext('2d');

        function drawHeartTree() {
            treeCanvas.width = treeCanvas.parentElement.clientWidth;
            treeCanvas.height = treeCanvas.parentElement.clientHeight;
            const tw = treeCanvas.width, th = treeCanvas.height;

            treeCtx.clearRect(0, 0, tw, th);
            treeCtx.fillStyle = '#d4a373';
            treeCtx.fillRect(tw/2 - 6, th - 50, 12, 50);

            const leaves = 120;
            for (let i = 0; i < leaves; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * 45;
                const x = tw/2 + Math.cos(angle) * r;
                const y = th - 80 + Math.sin(angle) * r * 0.8;
                
                treeCtx.font = `${8 + Math.random()*8}px serif`;
                treeCtx.fillStyle = `hsl(${340 + Math.random()*30}, 90%, ${60 + Math.random()*20}%)`;
                treeCtx.fillText('♥', x, y);
            }
        }

        function updateClock() {
            const startDate = new Date("2024-09-24T00:00:00"); 
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24)) + 700;
            document.getElementById('liveClock').innerText = `Together for ${days} Days ✨`;
        }
        setInterval(updateClock, 1000);

        // ============================================================
        // 10. ANIMATION 3: NEON PARTICLE HEART
        // ============================================================
        const neonHeartContainer = document.getElementById('neonHeartContainer');
        const neonCanvas = document.getElementById('neonCanvas');
        const nCtx = neonCanvas.getContext('2d');
        let neonAnimId = null;

        function drawNeonHeart() {
            neonCanvas.width = neonHeartContainer.clientWidth;
            neonCanvas.height = neonHeartContainer.clientHeight;
            const nw = neonCanvas.width, nh = neonCanvas.height;

            nCtx.clearRect(0, 0, nw, nh);
            nCtx.save();
            nCtx.translate(nw/2, nh/2 - 10);

            nCtx.beginPath();
            const scale = Math.min(nw, nh) / 38;
            for (let t = 0; t <= Math.PI * 2; t += 0.02) {
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                if (t === 0) nCtx.moveTo(x, y);
                else nCtx.lineTo(x, y);
            }
            nCtx.strokeStyle = '#ff2a85';
            nCtx.lineWidth = 3;
            nCtx.shadowColor = '#00f2fe';
            nCtx.shadowBlur = 18;
            nCtx.stroke();
            nCtx.restore();

            neonAnimId = requestAnimationFrame(drawNeonHeart);
        }

        // ============================================================
        // 11. CARD MANAGEMENT
        // ============================================================
        let currentSlide = 0;
        const cardEl = document.getElementById('mainCard');
        const titleEl = document.getElementById('cardTitle');
        const descEl = document.getElementById('cardDesc');
        const actionArea = document.getElementById('actionArea');
        const cardImageWrap = document.getElementById('cardImageWrap');
        const cardImage = document.getElementById('cardImage');
        const imgCaption = document.getElementById('imgCaption');

        function showCard() {
            cardEl.style.display = 'block';
            currentSlide = 0;
            updateCard();
            triggerBurstFireworks();
        }

        function hideAllAnimations() {
            heartContainer.style.display = 'none';
            treeContainer.style.display = 'none';
            neonHeartContainer.style.display = 'none';
            cardImageWrap.style.display = 'none';
            if (neonAnimId) cancelAnimationFrame(neonAnimId);
        }

        function updateCard() {
            hideAllAnimations();
            const slide = slides[currentSlide];
            titleEl.innerText = slide.title;
            descEl.innerText = slide.desc || '';
            descEl.style.display = slide.desc ? 'block' : 'none';

            if (slide.hasImage && slide.imgSrc) {
                cardImageWrap.style.display = 'block';
                cardImage.src = slide.imgSrc;
                imgCaption.innerText = slide.imgCaption || '💕';
            } else if (slide.has3DHeart) {
                heartContainer.style.display = 'block';
                generate3DHeart();
            } else if (slide.hasHeartTree) {
                treeContainer.style.display = 'flex';
                drawHeartTree();
            } else if (slide.hasNeonHeart) {
                neonHeartContainer.style.display = 'block';
                drawNeonHeart();
            }

            if (slide.isMarryPage) {
                titleEl.classList.add('marry-me-title');
                actionArea.innerHTML = `
                    <div class="btn-group">
                        <button class="btn-yes" onclick="handleYesClick(event)">Yes, I Will! 💍💖</button>
                    </div>
                `;
                setTimeout(() => triggerBurstFireworks(), 300);
            } else {
                titleEl.classList.remove('marry-me-title');
                actionArea.innerHTML = `<div class="tap-card-hint">👉 TAP ANYWHERE TO CONTINUE</div>`;
            }
            triggerHeartBurst(W / 2, H / 2);
        }

        function handleCardClick() {
            if (!slides[currentSlide].isMarryPage) {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    updateCard();
                    triggerBurstFireworks();
                }
            }
        }

        function handleYesClick(e) {
            e.stopPropagation();
            hideAllAnimations();
            titleEl.innerText = '🎉 FOREVER & ALWAYS 🎉';
            descEl.innerText = 'I Love You So Much ᴀʏᴇꜱʜᴀ! ❤️ আপনার সাথে সারা জীবন কাটানোর জন্য অপেক্ষায় রইলাম।';
            descEl.style.display = 'block';
            titleEl.classList.add('marry-me-title');
            
            triggerGrandCelebration();

            actionArea.innerHTML = `
                <div class="btn-group">
                    <button class="btn-action" onclick="replaySlides(event)">REPLAY 🔄</button>
                    <button class="btn-action btn-home" onclick="goHome(event)">HOME 🏠</button>
                </div>
            `;
        }

        function replaySlides(e) {
            e.stopPropagation();
            currentSlide = 0;
            updateCard();
            triggerBurstFireworks();
        }

        function goHome(e) {
            e.stopPropagation();
            hideAllAnimations();
            cardEl.style.display = 'none';
            pullScreen.style.display = 'flex';
            pullScreen.style.opacity = '1';
            cordLine.style.height = '240px';
            welRow1.classList.remove('show');
            welRow2.classList.remove('show');
            isStarted = false; currentDrag = 0; seqIndex = 0;
            heartParticles = []; particles = [];
            initMatrixColumns();
            tCtx.clearRect(0, 0, W, H);
            fwCtx.clearRect(0, 0, W, H);
            hCtx.clearRect(0, 0, W, H);
            rightTapBtn.style.display = 'none';
            bgMusic.pause(); bgMusic.currentTime = 0;
            heartCreated = false;
        }
    </script>
</body>
</html>
