<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayesha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05000a;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Landscape Warning Screen */
        #landscape-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0d001a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffb6c1;
            text-align: center;
            padding: 20px;
        }

        .phone-icon {
            font-size: 60px;
            animation: rotatePhone 2s infinite ease-in-out;
            margin-bottom: 20px;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* Welcome Screen with Flowers */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #2a0033, #05000a);
            z-index: 8000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        .flower-side {
            font-size: 75px;
            animation: floatFlower 2.5s ease-in-out infinite alternate;
        }

        @keyframes floatFlower {
            0% { transform: translateY(-15px) scale(1); }
            100% { transform: translateY(15px) scale(1.1); }
        }

        .welcome-title {
            color: #ff69b4;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 25px #ff1493, 0 0 50px #ff69b4;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        /* Canvases */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Interactive Letter Card */
        .card-container {
            position: relative;
            z-index: 10;
            background: rgba(15, 5, 25, 0.9);
            border: 2px solid #ff69b4;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 105, 180, 0.7);
            backdrop-filter: blur(10px);
            display: none;
            animation: popup 0.8s ease-out forwards;
        }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-title {
            font-size: 24px;
            color: #ff69b4;
            margin-bottom: 15px;
        }

        .card-desc {
            font-size: 16px;
            color: #fff;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-custom {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff1493;
            transition: 0.2s;
        }

        .btn-custom:active {
            transform: scale(0.95);
        }

        @media screen and (orientation: landscape) {
            #landscape-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="landscape-warning">
        <div class="phone-icon">📱</div>
        <h2>দয়া করে ফোনটি Landscape (আড়াআড়ি) মোডে ঘুরিয়ে নিন ✨</h2>
    </div>

    <div id="welcome-screen">
        <div class="flower-side">🌸🌷</div>
        <div class="welcome-title">WELCOME<br>AYESHA 💕</div>
        <div class="flower-side">🌷🌸</div>
    </div>

    <canvas id="matrixCanvas"></canvas>
    <canvas id="textCanvas"></canvas>

    <div id="mainCard" class="card-container">
        <h2 id="cardTitle" class="card-title"></h2>
        <p id="cardDesc" class="card-desc"></p>
        <button id="nextBtn" class="btn-custom" onclick="nextSlide()">Tap to Continue 💕</button>
    </div>

    <script>
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const textCanvas = document.getElementById('textCanvas');
        const tCtx = textCanvas.getContext('2d');
        const welcomeScreen = document.getElementById('welcome-screen');

        function resize() {
            matrixCanvas.width = textCanvas.width = window.innerWidth;
            matrixCanvas.height = textCanvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Matrix Background setup
        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*';
        const fontSize = 14;
        let columns = Math.floor(window.innerWidth / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrixBG() {
            mCtx.fillStyle = 'rgba(5, 0, 10, 0.15)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            mCtx.fillStyle = '#ff3388';
            mCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrixBG, 35);

        // Sequence List
        const sequence = [
            "3",
            "2",
            "1",
            "100 WEEKS",
            "700 DAYS",
            "AYESHA SADIK",
            "AHUBATI",
            "AHUBI",
            "I LOVE YOU"
        ];

        let currentSeq = 0;

        function renderTextPixel(text) {
            tCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            if (!text) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = textCanvas.width;
            tempCanvas.height = textCanvas.height;

            let dynamicFontSize = Math.min(textCanvas.width / (text.length * 0.75), textCanvas.height * 0.35);
            if (dynamicFontSize > 110) dynamicFontSize = 110;

            tempCtx.fillStyle = '#fff';
            tempCtx.font = `bold ${dynamicFontSize}px monospace`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(text, tempCanvas.width / 2, tempCanvas.height / 2);

            const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imgData.data;

            tCtx.font = `bold ${fontSize}px monospace`;
            tCtx.fillStyle = '#ffb6c1';
            tCtx.shadowColor = '#ff1493';
            tCtx.shadowBlur = 12;

            for (let y = 0; y < tempCanvas.height; y += fontSize) {
                for (let x = 0; x < tempCanvas.width; x += fontSize) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (data[index + 3] > 128) {
                        const randomChar = chars.charAt(Math.floor(Math.random() * chars.length));
                        tCtx.fillText(randomChar, x, y);
                    }
                }
            }
        }

        // Flow controller
        setTimeout(() => {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                playSequence();
            }, 1500);
        }, 3000);

        function playSequence() {
            if (currentSeq < sequence.length) {
                renderTextPixel(sequence[currentSeq]);
                currentSeq++;
                setTimeout(playSequence, 1600);
            } else {
                renderTextPixel("");
                showCard();
            }
        }

        // Proposal Cards Logic
        const cardEl = document.getElementById('mainCard');
        const titleEl = document.getElementById('cardTitle');
        const descEl = document.getElementById('cardDesc');
        const btnEl = document.getElementById('nextBtn');

        let currentSlide = 0;
        const slides = [
            { 
                title: "✨ 100 Weeks & 700 Days ✨", 
                desc: "আয়েশা সাদিক (AHUBATI, AHUBI), ১০০ টি সপ্তাহ এবং ৭০০ টি দিন ধরে আমার পাশে থাকার জন্য অনেক ধন্যবাদ।" 
            },
            { 
                title: "💖 My Special One 💖", 
                desc: "জীবনের প্রতিটি মুহূর্ত তোমার ভালোবাসা দিয়ে সুন্দর করার জন্য আমি চিরকৃতজ্ঞ।" 
            },
            { 
                title: "💍 Will You Marry Me? 💍", 
                desc: "সারাটা জীবন কি এভাবেই আমার পাশে থাকবে? ❤️" 
            }
        ];

        function showCard() {
            cardEl.style.display = 'block';
            updateCard();
        }

        function updateCard() {
            titleEl.innerText = slides[currentSlide].title;
            descEl.innerText = slides[currentSlide].desc;
            if (currentSlide === slides.length - 1) {
                btnEl.innerText = "YES, I WILL! 💖";
                btnEl.style.background = "linear-gradient(45deg, #00b09b, #96c93d)";
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateCard();
            } else {
                titleEl.innerText = "Yayyy! 🎉❤️";
                descEl.innerText = "Welcome to our forever journey, Ayesha Sadik! 🥰✨";
                btnEl.style.display = "none";
            }
        }
    </script>
</body>
</html>
